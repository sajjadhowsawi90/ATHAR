<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>أثر — ATHAR</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b2540;--teal:#0f8b8d;--teal2:#0a6c78;--muted:#5b7083;--bg:#eef6f6;--line:#e1eded;--green:#2e9e6b;--amber:#e8a838;--red:#d64545}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 Cairo,Tahoma,sans-serif}#app{max-width:540px;min-height:100vh;margin:auto;background:linear-gradient(#fff,#f6fbfb);padding-bottom:78px;box-shadow:0 0 25px #0b254012}header{position:sticky;top:0;z-index:4;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line)}header strong{font-size:24px;color:var(--teal)}main{padding:14px 16px}h2{margin:4px 0 10px}h3{margin:0 0 6px;font-size:17px}.muted{color:var(--muted);font-size:14px}.card{background:#fff;border:1px solid #e6f0f1;border-radius:17px;padding:14px;margin:12px 0;box-shadow:0 3px 12px #0b254008}.hero{padding:18px;border:0;border-radius:18px;color:#fff;background:linear-gradient(135deg,var(--teal),var(--teal2));font-size:19px}.btn{display:block;width:100%;margin:8px 0;padding:12px;border:0;border-radius:14px;background:var(--teal);color:white;font:700 16px Cairo;cursor:pointer}.btn.alt{background:white;color:var(--teal);border:1px solid var(--teal)}.btn.red{background:#fff;color:var(--red);border:1px solid var(--red)}.btn:disabled{opacity:.5}.link{border:0;border-radius:20px;padding:6px 12px;background:#e4f3f3;color:var(--teal2);font:600 14px Cairo;cursor:pointer}.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);z-index:5;display:flex;width:100%;max-width:540px;padding-bottom:env(safe-area-inset-bottom,0);background:white;border-top:1px solid var(--line)}.tabs button{flex:1;padding:12px;border:0;background:white;color:var(--muted);font:600 15px Cairo}.tabs .active{color:var(--teal);border-top:3px solid var(--teal)}.chip{display:inline-block;padding:2px 11px;border-radius:18px;color:#fff;background:var(--muted);font-size:13px}.row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid #eaf2f3;font-size:14px}.notice{padding:10px;border-right:4px solid var(--amber);background:#fff8e9;border-radius:8px;font-size:14px}.emergency{padding:12px;border:1px solid #f1c7c7;background:#fff7f7;border-radius:14px}.video{position:relative;aspect-ratio:4/3;overflow:hidden;border-radius:16px;background:#111}.video video,.video canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}.hand-guide{position:absolute;right:4%;bottom:4%;width:35%;height:43%;display:grid;place-items:center;border:3px dashed var(--amber);border-radius:18px;background:#09101833;color:#fff;font-weight:700;text-align:center;padding:5px;pointer-events:none}.meter{height:8px;overflow:hidden;border-radius:8px;background:#e2ebeb}.meter i{display:block;height:100%;width:0;background:var(--green);transition:width .2s}.timer{font-size:36px;font-weight:800;text-align:center;color:var(--teal)}textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:10px;font:inherit}.word{display:inline-block;margin:3px;padding:3px 10px;border-radius:15px;background:#dff3ea;cursor:pointer}.word.no{background:#f8e0e0;text-decoration:line-through}.scroller{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:right;padding:7px;border-bottom:1px solid var(--line)}svg{width:100%;height:auto}#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:10;display:none;max-width:90%;padding:8px 16px;border-radius:18px;background:var(--ink);color:#fff}@media print{header,.tabs,.btn,.link,#toast{display:none!important}}
</style></head><body><div id="app"></div><div id="toast"></div>
<script type="module">
const app=document.querySelector('#app'),$=s=>document.querySelector(s),toast=m=>{const e=$('#toast');e.textContent=m;e.style.display='block';clearTimeout(toast.k);toast.k=setTimeout(()=>e.style.display='none',3200)};
const tests=[{id:'s1',name:'الطلاقة الدلالية: الحيوانات',kind:'sem',sec:45,prompt:'اذكر أكبر عدد ممكن من أسماء الحيوانات.'},{id:'l1',name:'الطلاقة الحرفية: ط، ر، و',kind:'let',letters:['ط','ر','و'],sec:20,prompt:'اذكر كلمات تبدأ بالحرف الظاهر؛ 20 ثانية لكل حرف.'},{id:'a1',name:'التناوب بين الفئات',kind:'switch',sec:60,prompt:'اذكر حيوانًا ثم فاكهة أو خضارًا بالتناوب.'},{id:'s2',name:'الطلاقة الدلالية: الفواكه والخضروات',kind:'sem',sec:45,prompt:'اذكر أكبر عدد ممكن من الفواكه والخضروات.'},{id:'l2',name:'الطلاقة الحرفية: ق، د، س',kind:'let',letters:['ق','د','س'],sec:20,prompt:'اذكر كلمات تبدأ بالحرف الظاهر؛ 20 ثانية لكل حرف.'},{id:'a2',name:'التناوب بين الفئات — نسخة بديلة',kind:'switch',sec:60,prompt:'اذكر حيوانًا ثم فاكهة أو خضارًا بالتناوب.'}];
const animals='قطة قط قطو كلب حصان جمل ناقة بعير بقرة ثور عجل خروف غنم ضان ماعز معزة حمار أسد نمر فهد فيل زرافة قرد نسناس ذئب ذيب ثعلب أرنب فأر جرذ دجاجة جاجة ديك بطة وزة حمامة حمام صقر نسر عصفور غراب هدهد بومة ببغاء طاووس نعامة غزال ظبي وعل ضبع دب سمكة سمك حوت دلفين قرش تمساح ثعبان حية عقرب سحلية ضب ورل حرباء سلحفاة ضفدع خفاش وطواط قنفذ سنجاب زرزور يمامة'.split(' '),produce='تفاح برتقال موز عنب رمان تمر رطب بطيخ شمام فراولة مانجو جوافة خوخ مشمش كمثرى اجاص تين ليمون كيوي أناناس طماطم بندورة خيار بصل ثوم بطاطس بطاطا جزر كوسا باذنجان فلفل خس جرجير ملفوف كرنب قرنبيط سبانخ بامية فاصوليا بازلاء ذرة فجل لفت شمندر كراث بقدونس نعناع زيتون توت دراق'.split(' ');
const norm=w=>String(w).toLowerCase().replace(/[\u064B-\u065F\u0640]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[.,،؛!?؟]/g,'').replace(/^ال/,''),animals=new Set(animals.map(norm)),produce=new Set(produce.map(norm));
let db;try{db=JSON.parse(localStorage.getItem('athar')||'{"consent":false,"sessions":[]}')}catch{db={consent:false,sessions:[]}}if(!Array.isArray(db.sessions))db.sessions=[];
let screen='home',stream=null,model=null,ac=null,analyser=null,source=null,processor=null,raf=0,timer=0,live=false,taskRun=false,records=[],speech=null,wordsText='',light=0,rms=0,lastHand=null,handSamples=[],audioSamples=[],sampleTimer=0;
const htm=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),testNow=()=>tests[db.sessions.length%tests.length],dt=t=>new Date(t).toLocaleString('ar-SA',{dateStyle:'short',timeStyle:'short'}),badge=s=>s.baseline?'<span class="chip" style="background:#718394">خط الأساس قيد التكوين</span>':s.flag==='repeat'?'<span class="chip" style="background:#d64545">إشارة متكررة</span>':s.flag==='change'?'<span class="chip" style="background:#e8a838">تغير يحتاج إعادة قياس</span>':'<span class="chip" style="background:#2e9e6b">ضمن النمط المسجل</span>',save=()=>{try{localStorage.setItem('athar',JSON.stringify(db))}catch{toast('تعذر حفظ البيانات المحلية؛ قد تكون مساحة التخزين ممتلئة.')}};
function header(action=''){return `<header><strong>أثر <small style="font:13px Arial;color:#5b7083">ATHAR</small></strong>${action||'<button class="link" data-nav="doctor">وضع الطبيب</button>'}</header>`}function tabs(){return `<nav class="tabs"><button class="${screen==='home'?'active':''}" data-nav="home">الرئيسية</button><button class="${screen==='log'?'active':''}" data-nav="log">السجل</button></nav>`}
function emergency(){return `<section class="emergency"><b>تحتاج مساعدة عاجلة؟</b><p class="muted">التطبيق ليس بديلًا عن الرعاية الطبية أو الطوارئ. في السعودية اتصل بالإسعاف 997 أو رقم الطوارئ المحلي.</p><a class="btn red" href="tel:997">اتصال بالإسعاف 997</a></section>`}
function median(a){const b=a.filter(Number.isFinite).sort((x,y)=>x-y);return b.length?b[Math.floor(b.length/2)]:null}function sd(a){if(a.length<2)return 0;const m=a.reduce((s,x)=>s+x,0)/a.length;return Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/a.length)}
function baseFor(testId,key,field){const old=db.sessions.filter(s=>s.testId===testId&&!s.demo&&s.metrics?.[key]?.[field]!=null).slice(0,3).map(s=>s.metrics[key][field]);return old.length>=3?old:null}
function compare(metrics,testId){const domain={voice:[['pause',1],['pitchVar',1]],motion:[['tremor',1],['irregularity',1]],cognitive:[['valid',-1]]},out={};for(const k in domain){const vals=[];for(const [field,dir] of domain[k]){const b=baseFor(testId,k,field),x=metrics[k]?.[field];if(!b||x==null||!Number.isFinite(x))continue;const center=median(b),mad=median(b.map(y=>Math.abs(y-center))),scale=Math.max(1.4826*(mad||0),.15*Math.abs(center),field==='valid'?1:.01);vals.push(Math.max(0,Math.min(5,dir*(x-center)/scale)))}out[k]=vals.length?vals.reduce((s,x)=>s+x,0)/vals.length:null}return out}
function statusFor(z,prev){const good=Object.values(z).filter(Number.isFinite),n=good.filter(x=>x>=2).length;if(!good.length)return{baseline:true,flag:'baseline'};if(n>=2)return{baseline:false,flag:prev?.flag==='change'||prev?.flag==='repeat'?'repeat':'change'};return{baseline:false,flag:'normal'}}
function trend(){const ss=db.sessions.filter(s=>s.z&&!s.baseline).slice(-12);if(ss.length<2)return '<p class="muted">يظهر الاتجاه بعد اكتمال خط أساس لجلستين أو أكثر من الاختبار نفسه.</p>';const colors={voice:'#0f8b8d',motion:'#e8a838',cognitive:'#7455bf'},keys=Object.keys(colors),W=300,H=120,L=30,X=i=>L+i*(W-L-8)/(ss.length-1),Y=y=>H-14-Math.min(5,Math.max(0,y))*17;let g=`<line x1="${L}" x2="${W}" y1="${Y(2)}" y2="${Y(2)}" stroke="#d64545" stroke-dasharray="4 3"/><text x="1" y="${Y(2)+3}" font-size="9">2</text>`;keys.forEach(k=>{const pts=ss.map((s,i)=>s.z[k]==null?null:`${X(i)},${Y(s.z[k])}`).filter(Boolean);if(pts.length>1)g+=`<polyline fill="none" stroke="${colors[k]}" stroke-width="2" points="${pts.join(' ')}"/>`;ss.forEach((s,i)=>{if(s.z[k]!=null)g+=`<circle cx="${X(i)}" cy="${Y(s.z[k])}" r="3" fill="${colors[k]}"/>`})});return `<p class="muted">الابتعاد عن خطك الشخصي بوحدات معيارية؛ الخط الأحمر عند 2 وحدتين إشارة لمراجعة القياس، وليس حدًا طبيًا أو تشخيصًا.</p><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="اتجاه التغير مقارنة بخط الأساس">${g}</svg><p class="muted"><span style="color:${colors.voice}">● الصوت</span>　<span style="color:${colors.motion}">● الحركة</span>　<span style="color:${colors.cognitive}">● الإجابات</span></p>`}
function renderHome(){screen='home';stopMedia();const t=testNow(),recent=db.sessions.slice(-3).reverse();app.innerHTML=header()+`<main><h2>متابعة الجلسات</h2><div class="hero">الجلسة رقم <b>${db.sessions.length+1}</b><br><small>${htm(t.name)}</small></div><section class="card"><h3>مهمة اليوم</h3><p>${htm(t.prompt)}</p><p class="muted">مدة المهمة ${t.sec}${t.kind==='let'?' ثانية لكل حرف':''}.</p></section>${emergency()}<section class="card"><h3>ملخص آخر الجلسات</h3>${recent.length?recent.map((s,i)=>`<div class="row"><span>${i===0?'الأخيرة':'قبل '+i+' جلسة'} · ${htm(s.testName)}</span>${badge(s)}</div>`).join(''):'<p class="muted">بعد تسجيل الجلسات ستظهر هنا الملخصات.</p>'}</section><section class="card"><h3>اتجاه التغير الشخصي</h3>${trend()}</section><button class="btn" data-action="start">بدء جلسة</button><button class="btn alt" data-nav="info">عن الاختبارات</button><button class="btn alt" data-action="demo">${db.sessions.some(x=>x.demo)?'إزالة السجل التوضيحي':'تحميل سجل توضيحي'}</button></main>${tabs()}`}
function renderInfo(){screen='info';stopMedia();app.innerHTML=header()+`<main><h2>عن الاختبارات</h2>${tests.map((t,i)=>`<section class="card"><h3>${i+1}. ${htm(t.name)}</h3><p>${htm(t.prompt)}</p><p class="muted">${t.kind==='let'?'ثلاثة أحرف، 20 ثانية لكل حرف':'المدة: '+t.sec+' ثانية'}</p></section>`).join('')}<p class="notice">المؤشرات تجريبية ولا تشخّص مرضًا. لا تُصنّف الجلسة كمستقرة قبل اكتمال خط أساس شخصي صالح.</p><button class="btn alt" data-nav="home">رجوع</button></main>${tabs()}`}
function renderLog(){screen='log';stopMedia();app.innerHTML=header()+`<main><h2>سجل الجلسات</h2>${db.sessions.length?[...db.sessions].reverse().map(s=>`<section class="card"><b>${htm(s.testName||'جلسة')}</b><p class="muted">${dt(s.ts)}</p>${badge(s)}<p class="muted">${s.baseline?'خط الأساس قيد التكوين':s.flag==='repeat'?'إشارة تكررت في القياسات؛ اعرض التفاصيل على المختص.':s.flag==='change'?'ظهر تغير واحد؛ يُفضّل إعادة القياس في ظروف مشابهة.':'لا يظهر تغير واضح مقارنة بخط الأساس المسجل.'}</p></section>`).join(''):'<p class="muted">لا توجد جلسات.</p>'}<button class="btn alt" data-action="print">طباعة / حفظ PDF</button></main>${tabs()}`}
function renderDoctor(){screen='doctor';stopMedia();const ss=[...db.sessions].reverse();app.innerHTML=header('<button class="link" data-nav="home">واجهة المريض</button>')+`<main><h2>لوحة الطبيب</h2><p class="notice">التحليل استكشافي وغير مُعتمد للتشخيص. لا تُرسل المنصة تنبيهات فعلية. المقارنة تكون بخط أساس الشخص نفسه، ومن الاختبار نفسه، بعد 3 جلسات سابقة قابلة للمقارنة.</p><section class="card"><h3>اتجاه المؤشرات</h3>${trend()}</section>${ss.length?ss.slice(0,12).map(s=>`<details class="card"><summary>${dt(s.ts)} · ${htm(s.testName)} ${badge(s)}</summary><p class="muted">${s.baseline?'لا تتوفر بعد 3 جلسات سابقة من الاختبار نفسه لبناء المقارنة.':'درجة الانحراف (وحدات معيارية) مقارنة بوسيط أول 3 قياسات سابقة للاختبار نفسه؛ لا تمثل تشخيصًا.'}</p>${Object.entries({الصوت:s.metrics?.voice,الحركة:s.metrics?.motion,الإجابات:s.metrics?.cognitive}).map(([name,obj])=>`<h3>${name}</h3>${obj?Object.entries(obj).map(([k,v])=>`<div class="row"><span>${({pause:'نسبة الصمت %',pitchVar:'تباين التردد الأساسي',tremor:'اهتزاز اليد النسبي %',irregularity:'تغير سرعة الحركة',valid:'إجابات مقبولة',repeats:'كلمات مكررة'})[k]||k}</span><b>${Number.isFinite(v)?v.toFixed(2):'—'}</b></div>`).join(''):'<p class="muted">غير متاح</p>'}`).join('')}<div class="row"><span>الانحراف الشخصي: صوت / حركة / إجابات</span><b>${s.z?['voice','motion','cognitive'].map(k=>s.z[k]==null?'—':s.z[k].toFixed(1)).join(' / '):'—'}</b></div></details>`).join(''):'<p class="muted">لا توجد جلسات.</p>'}<button class="btn alt" data-action="print">طباعة / حفظ PDF</button></main>${tabs()}`}
function renderConsent(){screen='consent';app.innerHTML=header()+`<main><h2>قبل أن تبدأ</h2><section class="card"><h3>الكاميرا والميكروفون</h3><p>يستخدمهما التطبيق أثناء الجلسة لقياس تجريبي لحركة اليد والصوت. تُحفظ النتائج في تخزين المتصفح على هذا الجهاز.</p></section><section class="card"><h3>حدود الاستخدام</h3><p>هذه نسخة تجريبية وليست أداة تشخيص أو بديلًا عن تقييم المختص. لن تُرسل بيانات أو تنبيهات إلى طبيب.</p></section><label><input id="consent" type="checkbox"> أوافق على الاستخدام التجريبي للكاميرا والميكروفون.</label><button class="btn" data-action="consent">متابعة</button></main>`}
function renderSession(){screen='session';const t=testNow();app.innerHTML=header('<button class="link" data-nav="home">إلغاء</button>')+`<main><h2>${htm(t.name)}</h2><section class="card"><p>${htm(t.prompt)}</p><p class="muted">ثبّت الجهاز. أبقِ اليد داخل المربع المنقط أسفل يمين الصورة وثبّتها قدر الإمكان أثناء الاختبار. هذا يساعد على مقارنة القياسات، لكنه لا يجعلها تشخيصًا.</p></section><div class="video"><video id="video" muted playsinline></video><canvas id="canvas"></canvas><div class="hand-guide">ضع يدك هنا<br><small>ثبّتها داخل الإطار</small></div></div><section class="card"><div class="row"><span>الكاميرا والنموذج</span><b id="cameraStatus">جارٍ التهيئة…</b></div><div class="row"><span>الإضاءة</span><b id="lightStatus">—</b></div><div class="row"><span>مستوى الصوت</span><b id="audioStatus">—</b></div><div class="meter"><i id="audioMeter"></i></div></section><p id="status" class="muted">اسمح باستخدام الكاميرا والميكروفون.</p><div id="timer" class="timer"></div><p id="transcript" class="muted"></p><button id="begin" class="btn" data-action="begin" disabled>ابدأ الاختبار</button><section id="review" class="card" hidden></section></main>`;initMedia()}
async function initMedia(){setText('#status','جارٍ طلب إذن الكاميرا والميكروفون…');try{if(!navigator.mediaDevices?.getUserMedia)throw Error('افتح الموقع عبر HTTPS واستخدم متصفحًا يدعم الكاميرا.');stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:{echoCancellation:false,noiseSuppression:false}});const v=$('#video');v.srcObject=stream;await v.play();ac=new(window.AudioContext||window.webkitAudioContext)();await ac.resume();source=ac.createMediaStreamSource(stream);analyser=ac.createAnalyser();analyser.fftSize=2048;source.connect(analyser);processor=ac.createScriptProcessor(2048,1,1);processor.onaudioprocess=e=>sampleAudio(e.inputBuffer.getChannelData(0));source.connect(processor);processor.connect(ac.destination);const vision=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0');const fs=await vision.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm');const opts={baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task'},runningMode:'VIDEO',numHands:1};model=await vision.HandLandmarker.createFromOptions(fs,opts);$('#cameraStatus').textContent='جاهز';setText('#status','أبقِ يدك في المربع وانتظر بدء القياس.');$('#begin').disabled=false;live=true;loop(vision)}catch(e){setText('#status','تعذّر بدء الكاميرا أو نموذج اليد: '+e.message);$('#cameraStatus').textContent='غير جاهز';stopMedia()}}
function setText(s,t){const e=$(s);if(e)e.textContent=t}
function sampleAudio(buf){let sum=0;for(let i=0;i<buf.length;i++)sum+=buf[i]*buf[i];const r=Math.sqrt(sum/buf.length);rms=.8*rms+.2*r;if(taskRun)audioSamples.push({t:performance.now(),r})}
function loop(vision){if(!live||screen!=='session')return;raf=requestAnimationFrame(()=>loop(vision));const v=$('#video'),c=$('#canvas');if(!v||v.readyState<2)return;if(c.width!==v.videoWidth){c.width=v.videoWidth;c.height=v.videoHeight}const ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);let hand=null;try{const res=model.detectForVideo(v,performance.now());hand=res.landmarks?.[0]||null}catch{}if(hand){ctx.fillStyle='#ffbf47';hand.forEach(p=>{ctx.beginPath();ctx.arc(p.x*c.width,p.y*c.height,4,0,Math.PI*2);ctx.fill()});if(taskRun){const span=Math.hypot(hand[0].x-hand[9].x,hand[0].y-hand[9].y)||.1;handSamples.push({t:performance.now(),x:hand[9].x,y:hand[9].y,span})}}const lightCanvas=loop.c||(loop.c=document.createElement('canvas'));lightCanvas.width=16;lightCanvas.height=12;const cx=lightCanvas.getContext('2d');cx.drawImage(v,0,0,16,12);const pixels=cx.getImageData(0,0,16,12).data;let lum=0;for(let i=0;i<pixels.length;i+=4)lum+=(pixels[i]+pixels[i+1]+pixels[i+2])/3;lum/=pixels.length/4;$('#lightStatus').textContent=lum>65?'مناسبة':lum>35?'منخفضة قليلًا':'ضعيفة';$('#audioStatus').textContent=rms>.015?'الصوت واضح':rms>.004?'صوت منخفض':'بانتظار الكلام';$('#audioMeter').style.width=Math.min(100,rms*1800)+'%'}
function stopMedia(){live=false;taskRun=false;cancelAnimationFrame(raf);clearInterval(timer);clearInterval(sampleTimer);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;try{model?.close()}catch{}model=null;try{processor?.disconnect();source?.disconnect();ac?.close()}catch{}processor=source=analyser=ac=null}
function scoreTranscript(t,text){const list=text.trim().split(/\s+/).filter(Boolean),accepted=[],seen=new Set();for(const raw of list){const w=norm(raw);if(w.length<2)continue;let ok=false;if(t.kind==='sem')ok=(t.id==='s1'?animals:produce).has(w);else if(t.kind==='let')ok=t.letters.some(ch=>w.startsWith(norm(ch)));else ok=animals.has(w)||produce.has(w);if(ok&&!seen.has(w)){accepted.push(w);seen.add(w)}}return{valid:accepted.length,repeats:list.length-accepted.length}}
function startTask(){const t=testNow(),nb=t.kind==='let'?3:1;records=[];handSamples=[];audioSamples=[];wordsText='';taskRun=true;let segment=0;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){try{speech=new SR();speech.lang='ar-SA';speech.continuous=true;speech.interimResults=false;speech.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)wordsText+=' '+e.results[i][0].transcript;setText('#transcript',wordsText)};speech.onerror=()=>{};speech.start()}catch{speech=null}}setText('#status',t.prompt);$('#begin').disabled=true;const total=t.sec*nb,start=performance.now();function tick(){if(!taskRun||screen!=='session')return;const elapsed=(performance.now()-start)/1000,left=Math.max(0,Math.ceil(total-elapsed));segment=Math.min(nb-1,Math.floor(elapsed/t.sec));$('#timer').textContent=(t.kind==='let'?`الحرف ${t.letters[segment]} · `:'')+left+' ث';if(left<=0){taskRun=false;try{speech?.stop()}catch{}showReview(t);return}timer=setTimeout(tick,200)}tick()}
function features(t,text){const cognitive=scoreTranscript(t,text),secs=t.sec*(t.kind==='let'?3:1);let pause=0;const active=audioSamples.filter(x=>x.r>.008).length;pause=audioSamples.length?100*(1-active/audioSamples.length):null;let tremor=null,irregularity=null;if(handSamples.length>10){const span=handSamples.reduce((s,p)=>s+p.span,0)/handSamples.length||.1;const residual=[];for(let i=3;i<handSamples.length-3;i++){const win=handSamples.slice(i-3,i+4),mx=win.reduce((s,p)=>s+p.x,0)/win.length,my=win.reduce((s,p)=>s+p.y,0)/win.length;residual.push(Math.hypot(handSamples[i].x-mx,handSamples[i].y-my)/span)}trem=100*Math.sqrt(residual.reduce((s,x)=>s+x*x,0)/(residual.length||1));const speeds=[];for(let i=1;i<handSamples.length;i++){const a=handSamples[i-1],b=handSamples[i],dt=(b.t-a.t)/1000;if(dt>0)speeds.push(Math.hypot(b.x-a.x,b.y-a.y)/span/dt)}irregularity=speeds.length>2?sd(speeds)/(speeds.reduce((s,x)=>s+x,0)/speeds.length||1):null}const voice={pause,pitchVar:null},motion={tremor,irregularity};return{metrics:{voice,motion,cognitive},quality:{handSamples:handSamples.length,audioSamples:audioSamples.length,seconds:secs}}}
function showReview(t){const panel=$('#review');panel.hidden=false;panel.innerHTML=`<h3>مراجعة الإجابات</h3><p class="muted">عدّل التفريغ إذا لزم؛ القياسات الآلية تجريبية.</p><textarea id="words" rows="3" placeholder="أدخل الكلمات مفصولة بمسافات">${htm(wordsText.trim())}</textarea><button class="btn" data-action="save">حفظ النتيجة</button>`;panel.scrollIntoView({behavior:'smooth'})}
function saveResult(){const t=testNow(),f=features(t,$('#words').value),z=compare(f.metrics,t.id),prev=[...db.sessions].reverse().find(s=>s.testId===t.id&&!s.demo),status=statusFor(z,prev);const session={ts:Date.now(),testId:t.id,testName:t.name,metrics:f.metrics,quality:f.quality,z,baseline:status.baseline,flag:status.flag,demo:false};db.sessions.push(session);save();R=session;stopMedia();renderResult()}
function renderResult(){screen='result';app.innerHTML=header()+`<main><h2>ملخص الجلسة</h2><section class="card">${badge(R)}<p>${R.baseline?'نحتاج إلى 3 جلسات سابقة من هذا الاختبار لبناء خطك الأساسي. لا تعني هذه النتيجة أن الأداء سليم أو غير سليم.':R.flag==='repeat'?'تكرر تغير عن خطك الأساسي في أكثر من مؤشر. اعرض التفاصيل على المختص؛ هذه إشارة آلية وليست تشخيصًا.':R.flag==='change'?'ظهر تغير في مؤشر أو أكثر عن خطك الأساسي؛ أعد القياس في ظروف مشابهة قبل الاستنتاج.':'لم يظهر تغير واضح عن خطك الأساسي في هذه الجلسة فقط.'}</p><p class="muted">النتيجة المختصرة للمريض؛ التفاصيل والقياسات في وضع الطبيب.</p></section><button class="btn" data-nav="home">الرئيسية</button></main>${tabs()}`}
function renderDoctor(){screen='doctor';stopMedia();const ss=[...db.sessions].reverse();app.innerHTML=header('<button class="link" data-nav="home">واجهة المريض</button>')+`<main><h2>لوحة الطبيب</h2><p class="notice">مقارنة استكشافية بالوسيط وMAD لأول 3 جلسات سابقة من الاختبار نفسه. الانحراف 2 ليس حدًا طبيًا؛ تنبيه للقياس والمراجعة فقط. لا تُرسل تنبيهات فعلية.</p><section class="card"><h3>الاتجاه الشخصي</h3>${trend()}</section>${ss.length?ss.map(s=>`<details class="card"><summary>${dt(s.ts)} · ${htm(s.testName)} ${badge(s)}</summary><p class="muted">${s.baseline?'خط الأساس قيد التكوين؛ لا نصنفها مستقرة.':'الانحرافات: صوت / حركة / إجابات (وحدات معيارية).'}</p><div class="row"><span>الانحراف</span><b>${s.z?['voice','motion','cognitive'].map(k=>s.z[k]==null?'—':s.z[k].toFixed(2)).join(' / '):'—'}</b></div>${Object.entries({الصوت:s.metrics?.voice,الحركة:s.metrics?.motion,الإدراك:s.metrics?.cognitive}).map(([title,obj])=>`<h3>${title}</h3>${obj?Object.entries(obj).map(([k,v])=>`<div class="row"><span>${({pause:'الصمت %',pitchVar:'تباين التردد',tremor:'اهتزاز اليد النسبي %',irregularity:'عدم انتظام السرعة',valid:'إجابات مقبولة',repeats:'كلمات مكررة'})[k]||k}</span><span>${Number.isFinite(v)?v.toFixed(2):'غير متاح'}</span></div>`).join(''):'<p class="muted">غير متاح</p>'}`).join('')}</details>`).join(''):'<p class="muted">لا توجد جلسات بعد.</p>'}<button class="btn alt" data-action="print">طباعة / حفظ PDF</button><button class="btn red" data-action="clear">حذف كل الجلسات</button></main>${tabs()}`}
function demoData(){if(db.sessions.some(s=>s.demo)){db.sessions=db.sessions.filter(s=>!s.demo);save();renderHome();return}for(let i=0;i<24;i++){const t=tests[i%6],step=Math.max(0,(i-8)/15),noise=((i*17)%7-3)*.035,metrics={voice:{pause:12+step*13+noise*10,pitchVar:null},motion:{tremor:1.2+step*2.7+noise,irregularity:.25+step*.45+noise/3},cognitive:{valid:14-step*5+noise*3,repeats:1+step*2}};const z=compare(metrics,t.id),prev=[...db.sessions].reverse().find(s=>s.testId===t.id&&s.demo),st=statusFor(z,prev);db.sessions.push({ts:Date.now()-(24-i)*86400000,testId:t.id,testName:t.name,metrics,quality:{handSamples:600,audioSamples:300,seconds:t.sec},z,baseline:st.baseline,flag:st.flag,demo:true})}save();renderHome()}
function clearSessions(){if(!confirm('حذف جميع الجلسات نهائيًا من هذا الجهاز؟'))return;db.sessions=[];save();renderHome()}
function route(v){if(v==='home')renderHome();else if(v==='log')renderLog();else if(v==='doctor')renderDoctor();else if(v==='info')renderInfo();else if(v==='start'){if(!db.consent)renderConsent();else renderSession()}}
app.addEventListener('click',e=>{const nav=e.target.closest('[data-nav]');if(nav){route(nav.dataset.nav);return}const b=e.target.closest('[data-action]');if(!b)return;switch(b.dataset.action){case'consent':if(!$('#consent').checked){toast('وافق على الشروط أولًا.');return}db.consent=true;save();renderHome();break;case'start':route('start');break;case'begin':startTask();break;case'save':saveResult();break;case'demo':demoData();break;case'clear':clearSessions();break;case'print':print();break}});
if(!db.consent)renderConsent();else renderHome();
</script></body></html>
