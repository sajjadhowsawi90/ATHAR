<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>أثر — ATHAR</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b2540;--teal:#0f8b8d;--teal2:#0a6c78;--muted:#5b7083;--bg:#eef6f6;--line:#e1eded;--green:#2e9e6b;--amber:#e8a838;--red:#d64545}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 Cairo,Tahoma,sans-serif}#app{max-width:540px;min-height:100vh;margin:auto;background:linear-gradient(#fff,#f6fbfb);padding-bottom:78px;box-shadow:0 0 25px #0b254012}header{position:sticky;top:0;z-index:4;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line)}header strong{font-size:24px;color:var(--teal)}main{padding:14px 16px}h2{margin:4px 0 10px}h3{margin:0 0 6px;font-size:17px}.muted{color:var(--muted);font-size:14px}.card{background:#fff;border:1px solid #e6f0f1;border-radius:17px;padding:14px;margin:12px 0;box-shadow:0 3px 12px #0b254008}.hero{padding:18px;border:0;border-radius:18px;color:#fff;background:linear-gradient(135deg,var(--teal),var(--teal2));font-size:19px}.btn{display:block;width:100%;margin:8px 0;padding:12px;border:0;border-radius:14px;background:var(--teal);color:white;font:700 16px Cairo,Tahoma,sans-serif;cursor:pointer}.btn.alt{background:white;color:var(--teal);border:1px solid var(--teal)}.btn.red{background:#fff;color:var(--red);border:1px solid var(--red)}.btn:disabled{opacity:.5}.link{border:0;border-radius:20px;padding:6px 12px;background:#e4f3f3;color:var(--teal2);font:600 14px Cairo,Tahoma,sans-serif;cursor:pointer}.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);z-index:5;display:flex;width:100%;max-width:540px;padding-bottom:env(safe-area-inset-bottom,0);background:white;border-top:1px solid var(--line)}.tabs button{flex:1;padding:12px;border:0;background:white;color:var(--muted);font:600 15px Cairo,Tahoma,sans-serif}.tabs .active{color:var(--teal);border-top:3px solid var(--teal)}.chip{display:inline-block;padding:2px 11px;border-radius:18px;color:#fff;background:var(--muted);font-size:13px}.row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid #eaf2f3;font-size:14px}.notice{padding:10px;border-right:4px solid var(--amber);background:#fff8e9;border-radius:8px;font-size:14px}.emergency{padding:12px;border:1px solid #f1c7c7;background:#fff7f7;border-radius:14px}.video{position:relative;aspect-ratio:4/3;overflow:hidden;border-radius:16px;background:#111}.video video,.video canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}.hand-guide{position:absolute;right:4%;bottom:4%;width:35%;height:43%;display:grid;place-items:center;border:3px dashed var(--amber);border-radius:18px;background:#09101866;color:white;font-weight:700;text-align:center;padding:5px;pointer-events:none}.meter{height:8px;overflow:hidden;border-radius:8px;background:#e2ebeb}.meter i{display:block;height:100%;width:0;background:var(--green);transition:width .2s}.timer{font-size:36px;font-weight:800;text-align:center;color:var(--teal)}textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:10px;font:inherit}.scroller{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:right;padding:7px;border-bottom:1px solid var(--line)}svg{width:100%;height:auto}#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:10;display:none;max-width:90%;padding:8px 16px;border-radius:18px;background:var(--ink);color:#fff}@media print{header,.tabs,.btn,.link,#toast{display:none!important}}
</style></head><body><div id="app"></div><div id="toast"></div>
<script>
(()=>{'use strict';
const app=document.getElementById('app'),$=s=>document.querySelector(s),toast=m=>{const e=$('#toast');e.textContent=m;e.style.display='block';clearTimeout(toast.k);toast.k=setTimeout(()=>e.style.display='none',3200)};
const tests=[{id:'s1',name:'الطلاقة الدلالية: الحيوانات',kind:'sem',sec:45,prompt:'اذكر أكبر عدد ممكن من أسماء الحيوانات.'},{id:'l1',name:'الطلاقة الحرفية: ط، ر، و',kind:'let',letters:['ط','ر','و'],sec:20,prompt:'اذكر كلمات تبدأ بالحرف الظاهر؛ 20 ثانية لكل حرف.'},{id:'a1',name:'التناوب بين الفئات',kind:'switch',sec:60,prompt:'اذكر حيوانًا ثم فاكهة أو خضارًا بالتناوب.'},{id:'s2',name:'الطلاقة الدلالية: الفواكه والخضروات',kind:'sem',sec:45,prompt:'اذكر أكبر عدد ممكن من الفواكه والخضروات.'},{id:'l2',name:'الطلاقة الحرفية: ق، د، س',kind:'let',letters:['ق','د','س'],sec:20,prompt:'اذكر كلمات تبدأ بالحرف الظاهر؛ 20 ثانية لكل حرف.'},{id:'a2',name:'التناوب بين الفئات — نسخة بديلة',kind:'switch',sec:60,prompt:'اذكر حيوانًا ثم فاكهة أو خضارًا بالتناوب.'}];
const norm=w=>String(w||'').toLowerCase().replace(/[\u064B-\u065F\u0640]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[.,،؛!?؟]/g,'').replace(/^ال/,''),animals=new Set('قطة قط قطو كلب حصان جمل ناقة بعير بقرة ثور عجل خروف غنم ضان ماعز معزة حمار أسد نمر فهد فيل زرافة قرد نسناس ذئب ذيب ثعلب أرنب فأر جرذ دجاجة جاجة ديك بطة وزة حمامة حمام صقر نسر عصفور غراب هدهد بومة ببغاء طاووس نعامة غزال ظبي وعل ضبع دب سمكة سمك حوت دلفين قرش تمساح ثعبان حية عقرب سحلية ضب ورل حرباء سلحفاة ضفدع خفاش وطواط قنفذ سنجاب زرزور يمامة'.split(' ').map(norm)),produce=new Set('تفاح برتقال موز عنب رمان تمر رطب بطيخ شمام فراولة مانجو جوافة خوخ مشمش كمثرى اجاص تين ليمون كيوي أناناس طماطم بندورة خيار بصل ثوم بطاطس بطاطا جزر كوسا باذنجان فلفل خس جرجير ملفوف كرنب قرنبيط سبانخ بامية فاصوليا بازلاء ذرة فجل لفت شمندر كراث بقدونس نعناع زيتون توت دراق'.split(' ').map(norm));
let db;try{db=JSON.parse(localStorage.getItem('athar')||'{"consent":false,"sessions":[]}')}catch{db={consent:false,sessions:[]}}if(!Array.isArray(db.sessions)){const old=Array.isArray(db.S)?db.S:[];db={consent:!!db.ok,sessions:old.map(s=>({ts:s.ts||Date.now(),testId:s.tid||'legacy',testName:s.tid||'جلسة سابقة',legacy:true,baseline:true,flag:'baseline',z:null,metrics:{voice:s.v||{},motion:s.m||{},cognitive:s.c||{}},quality:{usable:false}}))};try{localStorage.setItem('athar',JSON.stringify(db))}catch{}}if(typeof db.consent!=='boolean')db.consent=!!db.ok;
let screen='home',stream=null,model=null,audioContext=null,analyser=null,source=null,processor=null,raf=0,timer=0,live=false,taskRun=false,speech=null,wordsText='',rms=0,lightValue=0,handSamples=[],audioSamples=[],pitchValues=[],lastPitchAt=0,qualitySnapshot=null,R=null;
const htm=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),testNow=()=>tests[db.sessions.length%tests.length],dt=t=>new Date(t).toLocaleString('ar-SA',{dateStyle:'short',timeStyle:'short'}),save=()=>{try{localStorage.setItem('athar',JSON.stringify(db))}catch{toast('تعذر الحفظ على هذا الجهاز.')}},median=a=>{const b=a.filter(Number.isFinite).sort((x,y)=>x-y);return b.length?b[Math.floor(b.length/2)]:null},std=a=>{if(a.length<2)return 0;const m=a.reduce((s,x)=>s+x,0)/a.length;return Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/a.length)};
function header(action=''){return `<header><strong>أثر <small style="font:13px Arial;color:#5b7083">ATHAR</small></strong>${action||'<button class="link" data-nav="doctor">وضع الطبيب</button>'}</header>`}function tabs(){return `<nav class="tabs"><button class="${screen==='home'?'active':''}" data-nav="home">الرئيسية</button><button class="${screen==='log'?'active':''}" data-nav="log">السجل</button></nav>`}function badge(s){if(s.legacy)return '<span class="chip" style="background:#718394">جلسة من إصدار سابق</span>';if(s.flag==='repeat')return '<span class="chip" style="background:#d64545">تغير متكرر — مراجعة</span>';if(s.flag==='change')return '<span class="chip" style="background:#e8a838">تغير — أعد القياس</span>';if(s.baseline)return '<span class="chip" style="background:#718394">خط الأساس قيد التكوين</span>';if(!s.quality?.usable)return '<span class="chip" style="background:#718394">القياس غير مكتمل</span>';return '<span class="chip" style="background:#2e9e6b">لا يظهر تغير واضح</span>'}function eligible(s){return !s.legacy&&!!s.quality?.usable}function cohort(s){return s.demo?'demo':'real'}function baselineSessions(testId,cohortName){return db.sessions.filter(s=>s.testId===testId&&eligible(s)&&cohort(s)==cohortName)}
function emergency(){return `<section class="emergency"><b>تحتاج مساعدة عاجلة؟</b><p class="muted">هذا التطبيق التجريبي ليس بديلًا عن الرعاية الطبية أو الطوارئ. في السعودية اتصل بالإسعاف 997 أو برقم الطوارئ المحلي.</p><a class="btn red" href="tel:997">اتصال بالإسعاف 997</a></section>`}
const metricSpec={voice:{pausePct:{dir:1,min:.5},pitchVar:{dir:0,min:.5},pitchInstability:{dir:1,min:.2}},motion:{tremorPct:{dir:1,min:.03},speedVariability:{dir:1,min:.03}},cognitive:{valid:{dir:-1,min:1},repeats:{dir:1,min:1},switches:{dir:-1,min:1}}};
function compare(metrics,testId,cohortName){const prior=baselineSessions(testId,cohortName).slice(0,3);if(prior.length<3)return{baseline:true,z:{voice:null,motion:null,cognitive:null},domains:{}};const z={},domains={};for(const domain of Object.keys(metricSpec)){const deviations=[];for(const [field,spec]of Object.entries(metricSpec[domain])){const value=metrics[domain]?.[field];if(!Number.isFinite(value))continue;const values=prior.map(s=>s.metrics?.[domain]?.[field]).filter(Number.isFinite);if(values.length<3)continue;const center=median(values),mad=median(values.map(v=>Math.abs(v-center))),scale=Math.max(1.4826*(mad||0),Math.abs(center)*.15,spec.min);const delta=(value-center)/scale;deviations.push(Math.max(0,Math.min(5,spec.dir===0?Math.abs(delta):spec.dir*delta)))}z[domain]=deviations.length?deviations.reduce((a,b)=>a+b,0)/deviations.length:null;domains[domain]=z[domain]!=null&&z[domain]>=2}return{baseline:false,z,domains}}
function makeFlag(result,previous){if(result.baseline)return'baseline';if(!Object.values(result.z).some(Number.isFinite))return'incomplete';const flagged=Object.entries(result.domains).filter(([,v])=>v).map(([k])=>k);if(!flagged.length)return'normal';const previousDomains=previous?.deviations||{};return flagged.some(k=>previousDomains[k])?'repeat':'change'}
function chart(){const sessions=db.sessions.filter(s=>!s.legacy&&!s.baseline&&s.z).slice(-18);if(sessions.length<2)return'<p class="muted">يظهر الرسم بعد اكتمال خط أساس لكل اختبار (3 جلسات سابقة صالحة).</p>';const colors={voice:'#0f8b8d',motion:'#e8a838',cognitive:'#7455bf'},keys=Object.keys(colors),W=300,H=128,L=28,Y=v=>H-15-Math.max(0,Math.min(5,v))*18,X=i=>L+i*(W-L-8)/(sessions.length-1);let g=`<line x1="${L}" x2="${W}" y1="${Y(2)}" y2="${Y(2)}" stroke="#d64545" stroke-dasharray="4 3"/><text x="2" y="${Y(2)+3}" font-size="9">2</text>`;for(const k of keys){let pts=[];sessions.forEach((s,i)=>{const v=s.z[k];if(Number.isFinite(v)){pts.push(`${X(i)},${Y(v)}`);g+=`<circle cx="${X(i)}" cy="${Y(v)}" r="3" fill="${colors[k]}"/>`}});if(pts.length>1)g+=`<polyline fill="none" stroke="${colors[k]}" stroke-width="2" points="${pts.join(' ')}"/>`}return `<p class="muted">مقارنة كل اختبار بأول 3 قياسات صالحة سابقة للاختبار نفسه: الوسيط وMAD يحسبان انحرافًا شخصيًا تقريبيًا. الخط عند 2 وحدتين إشارة لإعادة القياس، وليس حدًا طبيًا أو تشخيصًا. الجلسة الواحدة لا تكفي للاستنتاج.</p><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="اتجاه مؤشرات مقارنة بخط الأساس الشخصي">${g}</svg><p class="muted"><span style="color:${colors.voice}">● الصوت</span>　<span style="color:${colors.motion}">● الحركة</span>　<span style="color:${colors.cognitive}">● الإجابات</span></p>`}
function renderHome(){screen='home';stopMedia();const t=testNow(),recent=db.sessions.filter(s=>!s.demo).slice(-3).reverse();app.innerHTML=header()+`<main><h2>متابعة الجلسات</h2><div class="hero">الجلسة رقم <b>${db.sessions.filter(s=>!s.demo).length+1}</b><br><small>${htm(t.name)}</small></div><section class="card"><h3>مهمة اليوم</h3><p>${htm(t.prompt)}</p><p class="muted">المدة ${t.sec}${t.kind==='let'?' ثانية لكل حرف':' ثانية'}.</p></section>${emergency()}<section class="card"><h3>ملخص آخر الجلسات</h3>${recent.length?recent.map((s,i)=>`<div class="row"><span>${i===0?'الأخيرة':'قبل '+i+' جلسة'} · ${htm(s.testName)}</span>${badge(s)}</div>`).join(''):'<p class="muted">ستظهر الملخصات بعد تسجيل جلسات.</p>'}</section><section class="card"><h3>اتجاه التغير الشخصي</h3>${chart()}</section><button class="btn" data-action="start">بدء جلسة</button><button class="btn alt" data-nav="info">عن الاختبارات</button><button class="btn alt" data-action="demo">${db.sessions.some(s=>s.demo)?'إزالة السجل التوضيحي':'تحميل سجل توضيحي'}</button></main>${tabs()}`}
function renderInfo(){screen='info';stopMedia();app.innerHTML=header()+`<main><h2>عن الاختبارات</h2>${tests.map((t,i)=>`<section class="card"><h3>${i+1}. ${htm(t.name)}</h3><p>${htm(t.prompt)}</p><p class="muted">${t.kind==='let'?'ثلاثة أحرف، 20 ثانية لكل حرف':'المدة: '+t.sec+' ثانية'}</p></section>`).join('')}<p class="notice">المؤشرات تجريبية ولا تشخّص مرضًا. لا تُصنّف الجلسة بأنها مستقرة قبل اكتمال خط أساس شخصي صالح.</p><button class="btn alt" data-nav="home">رجوع</button></main>${tabs()}`}
function renderLog(){screen='log';stopMedia();app.innerHTML=header()+`<main><h2>سجل الجلسات</h2>${db.sessions.length?[...db.sessions].reverse().map(s=>`<section class="card"><b>${htm(s.testName||'جلسة')}</b><p class="muted">${dt(s.ts)}</p>${badge(s)}<p class="muted">${summaryText(s)}</p></section>`).join(''):'<p class="muted">لا توجد جلسات.</p>'}<button class="btn alt" data-action="print">طباعة / حفظ PDF</button></main>${tabs()}`}
function summaryText(s){if(s.legacy)return'بيانات محفوظة من إصدار سابق؛ لا تُستخدم في المقارنة الجديدة.';if(s.flag==='repeat')return'تكرر انحراف عن خط الأساس في مؤشر أو أكثر. راجع التفاصيل مع مختص؛ ليست نتيجة تشخيصية.';if(s.flag==='change')return'ظهر انحراف في جلسة واحدة. أعد القياس في ظروف مشابهة قبل تفسيره.';if(s.baseline)return'خط الأساس قيد التكوين؛ نحتاج 3 جلسات سابقة صالحة من الاختبار نفسه.';if(!s.quality?.usable)return'القياس غير مكتمل بما يكفي للمقارنة.';return'لم يظهر انحراف واضح عن خط الأساس في هذه الجلسة فقط.'}
function renderDoctor(){screen='doctor';stopMedia();const ss=[...db.sessions].reverse();app.innerHTML=header('<button class="link" data-nav="home">واجهة المريض</button>')+`<main><h2>لوحة الطبيب</h2><p class="notice">مقارنة استكشافية بخط أساس الشخص نفسه، ومن الاختبار نفسه، بعد 3 جلسات صالحة. وحدتا انحراف إشارة لإعادة القياس وليستا حدًا طبيًا. لا تُرسل المنصة تنبيهات فعلية، والبيانات محلية على هذا الجهاز.</p><section class="card"><h3>اتجاه المؤشرات</h3>${chart()}</section>${ss.length?ss.map(s=>`<details class="card"><summary>${dt(s.ts)} · ${htm(s.testName)} ${badge(s)}</summary><p class="muted">${summaryText(s)}</p>${s.legacy?'<p class="muted">جلسة سابقة لا تحتوي قياسات متوافقة للمقارنة التفصيلية.</p>':`<p class="muted">انحرافات الصوت / الحركة / الإجابات (وحدات معيارية تقريبية): ${s.z?['voice','motion','cognitive'].map(k=>s.z[k]==null?'—':s.z[k].toFixed(2)).join(' / '):'—'}</p>${Object.entries({الصوت:s.metrics?.voice,الحركة:s.metrics?.motion,الإجابات:s.metrics?.cognitive}).map(([title,obj])=>`<h3>${title}</h3>${obj?Object.entries(obj).map(([k,v])=>`<div class="row"><span>${({pausePct:'فترات الصمت % (تقريبي)',pitchVar:'تباين طبقة الصوت %',pitchInstability:'تغير الطبقة بين الإطارات %',tremorPct:'اهتزاز اليد النسبي % (تقريبي)',speedVariability:'تغير سرعة الحركة',valid:'إجابات مقبولة',repeats:'كلمات مكررة',switches:'مرات التبديل'})[k]||k}</span><b>${Number.isFinite(v)?v.toFixed(2):'غير متاح'}</b></div>`).join(''):'<p class="muted">غير متاح</p>'}`).join('')}<div class="row"><span>جودة التسجيل</span><b>${s.quality?.usable?'صالحة للمقارنة':'غير مكتملة'}</b></div>`}</details>`).join(''):'<p class="muted">لا توجد جلسات.</p>'}<button class="btn alt" data-action="print">طباعة / حفظ PDF</button><button class="btn red" data-action="clear">حذف كل الجلسات</button></main>${tabs()}`}
function renderConsent(){screen='consent';app.innerHTML=header()+`<main><h2>قبل أن تبدأ</h2><section class="card"><h3>الكاميرا والميكروفون</h3><p>يستخدمهما التطبيق أثناء الجلسة لقياس تجريبي لحركة اليد والصوت. تُحفظ النتائج في تخزين المتصفح على هذا الجهاز.</p></section><section class="card"><h3>حدود الاستخدام</h3><p>هذه نسخة تجريبية وليست أداة تشخيص أو بديلًا عن تقييم المختص. لن تُرسل بيانات أو تنبيهات إلى طبيب.</p></section><label><input id="consent" type="checkbox"> أوافق على الاستخدام التجريبي للكاميرا والميكروفون.</label><button class="btn" data-action="consent">متابعة</button></main>`}
function renderSession(){screen='session';const t=testNow();app.innerHTML=header('<button class="link" data-nav="home">إلغاء</button>')+`<main><h2>${htm(t.name)}</h2><section class="card"><p>${htm(t.prompt)}</p><p class="muted">ثبّت الجهاز. أبقِ اليد داخل المربع المنقط أسفل يمين الصورة وثبّتها قدر الإمكان أثناء الاختبار. ثبات موضع اليد يساعد على المقارنة، لكنه لا يجعل القياس تشخيصيًا.</p></section><div class="video"><video id="video" muted playsinline></video><canvas id="canvas"></canvas><div class="hand-guide">ضع يدك هنا<br><small>ثبّتها داخل الإطار</small></div></div><section class="card"><div class="row"><span>الكاميرا والنموذج</span><b id="cameraStatus">جارٍ التهيئة…</b></div><div class="row"><span>الإضاءة</span><b id="lightStatus">—</b></div><div class="row"><span>مستوى الصوت</span><b id="audioStatus">—</b></div><div class="meter"><i id="audioMeter"></i></div><div class="row"><span>ثبات اليد داخل الإطار</span><b id="handStatus">—</b></div></section><p id="status" class="muted">اسمح باستخدام الكاميرا والميكروفون.</p><div id="timer" class="timer"></div><p id="transcript" class="muted"></p><button id="begin" class="btn" data-action="begin" disabled>ابدأ الاختبار</button><section id="review" class="card" hidden></section></main>`;initMedia()}
async function initMedia(){setText('#status','جارٍ طلب إذن الكاميرا والميكروفون…');try{if(!navigator.mediaDevices?.getUserMedia)throw Error('افتح الموقع عبر HTTPS واستخدم متصفحًا يدعم الكاميرا.');stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:{echoCancellation:false,noiseSuppression:false}});if(screen!=='session'){stopMedia();return}const v=$('#video');v.srcObject=stream;await v.play();audioContext=new(window.AudioContext||window.webkitAudioContext)();await audioContext.resume();source=audioContext.createMediaStreamSource(stream);analyser=audioContext.createAnalyser();analyser.fftSize=2048;source.connect(analyser);processor=audioContext.createScriptProcessor(2048,1,1);processor.onaudioprocess=e=>sampleAudio(e.inputBuffer.getChannelData(0));source.connect(processor);processor.connect(audioContext.destination);const vision=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0');if(screen!=='session'){stopMedia();return}const fs=await vision.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm');model=await vision.HandLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task'},runningMode:'VIDEO',numHands:1});if(screen!=='session'){stopMedia();return}$('#cameraStatus').textContent='جاهز';setText('#status','أبقِ يدك في المربع وانتظر بدء القياس.');$('#begin').disabled=false;live=true;loop(vision)}catch(e){setText('#status','تعذّر بدء الكاميرا أو نموذج اليد: '+e.message);const cs=$('#cameraStatus');if(cs)cs.textContent='غير جاهز';stopMedia()}}
function setText(s,t){const e=$(s);if(e)e.textContent=t}
function estimatePitch(buf,sr){const stride=4,n=Math.floor(buf.length/stride),x=new Float32Array(n);for(let i=0;i<n;i++)x[i]=buf[i*stride];const rate=sr/stride,minLag=Math.floor(rate/350),maxLag=Math.min(n-2,Math.floor(rate/70));let best=-1,bestLag=0;for(let lag=minLag;lag<=maxLag;lag++){let sum=0,a=0,b=0;for(let i=0;i<n-lag;i++){const u=x[i],v=x[i+lag];sum+=u*v;a+=u*u;b+=v*v}const corr=sum/Math.sqrt((a*b)||1);if(corr>best){best=corr;bestLag=lag}}return best>.55&&bestLag?rate/bestLag:null}
function sampleAudio(buf){let sum=0;for(let i=0;i<buf.length;i++)sum+=buf[i]*buf[i];const r=Math.sqrt(sum/buf.length);rms=.8*rms+.2*r;if(taskRun){const now=performance.now();audioSamples.push({t:now,r});if(now-lastPitchAt>100){const f=estimatePitch(buf,audioContext.sampleRate);if(f) pitchValues.push(f);lastPitchAt=now}}}
function loop(vision){if(!live||screen!=='session')return;raf=requestAnimationFrame(()=>loop(vision));const v=$('#video'),c=$('#canvas');if(!v||v.readyState<2)return;if(c.width!==v.videoWidth){c.width=v.videoWidth;c.height=v.videoHeight}const ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);let hand=null;try{const res=model.detectForVideo(v,performance.now());hand=res.landmarks?.[0]||null}catch{}let inBox=false;if(hand){hand.forEach(p=>{ctx.fillStyle='#ffbf47';ctx.beginPath();ctx.arc(p.x*c.width,p.y*c.height,4,0,Math.PI*2);ctx.fill()});const mirroredX=1-hand[9].x;inBox=mirroredX>.64&&mirroredX<.96&&hand[9].y>.54&&hand[9].y<.94;if(taskRun&&inBox){const scale=Math.hypot(hand[0].x-hand[9].x,hand[0].y-hand[9].y)||.1;handSamples.push({t:performance.now(),x:hand[9].x/scale,y:hand[9].y/scale,scale})}}const lightCanvas=loop.c||(loop.c=document.createElement('canvas'));lightCanvas.width=16;lightCanvas.height=12;const cx=lightCanvas.getContext('2d');cx.drawImage(v,0,0,16,12);const pixels=cx.getImageData(0,0,16,12).data;let lum=0;for(let i=0;i<pixels.length;i+=4)lum+=(pixels[i]+pixels[i+1]+pixels[i+2])/3;lightValue=lum/(pixels.length/4);const light=$('#lightStatus'),audio=$('#audioStatus'),meter=$('#audioMeter'),hs=$('#handStatus');if(light)light.textContent=lightValue>65?'مناسبة':lightValue>35?'منخفضة قليلًا':'ضعيفة';if(audio)audio.textContent=rms>.015?'الصوت واضح':rms>.004?'صوت منخفض':'بانتظار الكلام';if(meter)meter.style.width=Math.min(100,rms*1800)+'%';if(hs)hs.textContent=inBox?'داخل المربع':'أبقِ اليد داخل المربع'}
function stopMedia(){live=false;taskRun=false;cancelAnimationFrame(raf);clearTimeout(timer);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;try{model?.close()}catch{}model=null;try{processor?.disconnect();source?.disconnect();audioContext?.close()}catch{}processor=source=analyser=audioContext=null}
function scoreTranscript(t,text){const list=text.trim().split(/\s+/).filter(Boolean),accepted=[],seen=new Set();for(const raw of list){const w=norm(raw);if(w.length<2)continue;let ok=false;if(t.kind==='sem')ok=(t.id==='s1'?animals:produce).has(w);else if(t.kind==='let')ok=t.letters.some(ch=>w.startsWith(norm(ch)));else ok=animals.has(w)||produce.has(w);if(ok&&!seen.has(w)){accepted.push(w);seen.add(w)}}return{valid:accepted.length,repeats:list.length-accepted.length,switches:null}}
function startTask(){const t=testNow(),nb=t.kind==='let'?3:1;handSamples=[];audioSamples=[];pitchValues=[];wordsText='';taskRun=true;let segment=0;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){try{speech=new SR();speech.lang='ar-SA';speech.continuous=true;speech.interimResults=false;speech.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)wordsText+=' '+e.results[i][0].transcript;setText('#transcript',wordsText)};speech.onerror=()=>{};speech.start()}catch{speech=null}}setText('#status',t.prompt);$('#begin').disabled=true;const total=t.sec*nb,start=performance.now();function tick(){if(!taskRun||screen!=='session')return;const elapsed=(performance.now()-start)/1000,left=Math.max(0,Math.ceil(total-elapsed));segment=Math.min(nb-1,Math.floor(elapsed/t.sec));$('#timer').textContent=(t.kind==='let'?`الحرف ${t.letters[segment]} · `:'')+left+' ث';if(left<=0){taskRun=false;try{speech?.stop()}catch{}showReview(t);return}timer=setTimeout(tick,200)}tick()}
function tremorMetric(samples){if(samples.length<20)return null;const residual=[];for(let i=3;i<samples.length-3;i++){const window=samples.slice(i-3,i+4),mx=window.reduce((s,p)=>s+p.x,0)/window.length,my=window.reduce((s,p)=>s+p.y,0)/window.length;residual.push(Math.hypot(samples[i].x-mx,samples[i].y-my))}return residual.length?100*Math.sqrt(residual.reduce((s,x)=>s+x*x,0)/residual.length):null}
function features(t,text){const cognitive=scoreTranscript(t,text),duration=t.sec*(t.kind==='let'?3:1),threshold=Math.max(.006,rms*.18),pausePct=audioSamples.length?100*audioSamples.filter(x=>x.r<threshold).length/audioSamples.length:null,pitchMean=pitchValues.length?pitchValues.reduce((a,b)=>a+b,0)/pitchValues.length:null,pitchVar=pitchMean?100*std(pitchValues)/pitchMean:null,pitchInstability=pitchValues.length>2?100*median(pitchValues.slice(1).map((x,i)=>Math.abs(x-pitchValues[i])/(pitchValues[i]||1))):null,tremor=tremorMetric(handSamples),speed=[];for(let i=1;i<handSamples.length;i++){const a=handSamples[i-1],b=handSamples[i],dt=(b.t-a.t)/1000;if(dt>0)speed.push(Math.hypot(b.x-a.x,b.y-a.y)/dt)}const speedVariability=speed.length>3?std(speed)/(speed.reduce((a,b)=>a+b,0)/speed.length||1):null;let switches=null;if(t.kind==='switch'){const list=text.trim().split(/\s+/).map(norm).filter(Boolean);let prev=null;switches=0;for(const w of list){const cat=animals.has(w)?'a':produce.has(w)?'p':null;if(cat&&prev&&cat!==prev)switches++;if(cat)prev=cat}}cognitive.switches=switches;const usable=handSamples.length>=duration*5&&audioSamples.length>=duration*5&&lightValue>25;return{metrics:{voice:{pausePct,pitchVar,pitchInstability},motion:{tremorPct:tremor,speedVariability},cognitive},quality:{usable,handSamples:handSamples.length,audioSamples:audioSamples.length,light:Math.round(lightValue),seconds:duration}}}
function showReview(t){const panel=$('#review');panel.hidden=false;panel.innerHTML=`<h3>مراجعة الإجابات</h3><p class="muted">عدّل التفريغ إذا لزم. القياسات الآلية تجريبية ولا تكفي للتشخيص.</p><textarea id="words" rows="3" placeholder="أدخل الكلمات مفصولة بمسافات">${htm(wordsText.trim())}</textarea><button class="btn" data-action="save">حفظ النتيجة</button>`;panel.scrollIntoView({behavior:'smooth'})}
function saveSession(){const t=testNow(),result=features(t,$('#words')?.value||''),cohortName='real',comparison=result.quality.usable?compare(result.metrics,t.id,cohortName):{baseline:true,z:{voice:null,motion:null,cognitive:null},domains:{}},prev=[...db.sessions].reverse().find(s=>s.testId===t.id&&!s.demo&&eligible(s)),flag=result.quality.usable?makeFlag(comparison,prev):'incomplete',s={ts:Date.now(),testId:t.id,testName:t.name,metrics:result.metrics,quality:result.quality,z:comparison.z,deviations:comparison.domains,baseline:comparison.baseline,flag,demo:false};db.sessions.push(s);save();R=s;stopMedia();renderResult()}
function renderResult(){screen='result';app.innerHTML=header()+`<main><h2>ملخص الجلسة</h2><section class="card">${badge(R)}<p>${summaryText(R)}</p><p class="muted">هذا ملخص للمريض. القياسات التفصيلية متاحة في وضع الطبيب على هذا الجهاز.</p></section><button class="btn" data-nav="home">الرئيسية</button></main>${tabs()}`}
function buildDemo(){const existing=db.sessions.filter(s=>!s.demo);if(db.sessions.some(s=>s.demo)){db.sessions=existing;save();renderHome();return}for(let i=0;i<36;i++){const t=tests[i%6],progress=Math.max(0,Math.min(1,(i-12)/23)),noise=(((i*17)%7)-3)*.035,metrics={voice:{pausePct:18+progress*13+noise*5,pitchVar:5+progress*5+noise*2,pitchInstability:2+progress*3+noise},motion:{tremorPct:.25+progress*1.5+noise*.3,speedVariability:.22+progress*.45+noise/3},cognitive:{valid:15-progress*4+noise*2,repeats:1+progress*2,switches:t.kind==='switch'?8-progress*2:0}},quality={usable:true,handSamples:600,audioSamples:300,light:70,seconds:t.sec},comparison=compare(metrics,t.id,'demo'),prev=[...db.sessions].reverse().find(s=>s.testId===t.id&&s.demo&&eligible(s)),flag=makeFlag(comparison,prev);db.sessions.push({ts:Date.now()-(36-i)*86400000,testId:t.id,testName:t.name,metrics,quality,z:comparison.z,deviations:comparison.domains,baseline:comparison.baseline,flag,demo:true})}save();renderHome()}
function clearSessions(){if(!confirm('حذف جميع الجلسات نهائيًا من هذا الجهاز؟'))return;db.sessions=[];save();renderHome()}
function route(target){if(target==='home')renderHome();else if(target==='log')renderLog();else if(target==='doctor')renderDoctor();else if(target==='info')renderInfo();else if(target==='start'){if(!db.consent)renderConsent();else renderSession()}}
app.addEventListener('click',e=>{const n=e.target.closest('[data-nav]');if(n){route(n.dataset.nav);return}const b=e.target.closest('[data-action]');if(!b)return;switch(b.dataset.action){case'consent':if(!$('#consent').checked){toast('وافق على الشروط أولًا.');return}db.consent=true;save();renderHome();break;case'start':route('start');break;case'begin':startTask();break;case'save':saveSession();break;case'demo':buildDemo();break;case'clear':clearSessions();break;case'print':print();break}});
if(!db.consent)renderConsent();else renderHome();
window.addEventListener('error',e=>{console.error(e.error||e.message);if(!app.innerHTML.trim())app.innerHTML='<main><h2>تعذّر عرض الصفحة</h2><p>حدّث الصفحة وحاول مرة أخرى.</p></main>'});
})();
</script></body></html>
