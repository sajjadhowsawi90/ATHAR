const $=s=>document.querySelector(s),A=$('#app'),med=a=>{a=[...a].sort((x,y)=>x-y);return a[Math.floor(a.length/2)]},mean=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:0,sd=a=>{const m=mean(a);return Math.sqrt(mean(a.map(x=>(x-m)**2)))};

{id:'l2',n:'الطلاقة الحرفية: ق، د، س',k:'let',L:['ق','د','س'],t:60,p:'اذكر كلمات تبدأ بالحرف الظاهر',m:'الطلاقة الحرفية والبدء اللفظي وبعض الوظائف التنفيذية'},

const DIR={v:{f0sd:-1,jit:1,shim:1,hnr:-1,dbm:-1,syl:-1,np:1,xp:1},m:{spd:-1,irr:1,jerk:1,rng:-1,intr:1,trem:1},c:{valid:-1,rep:1,sw:-1}},LN=['مستقر','يحتاج متابعة','تغير ذو أولوية'],CL=['#2E9E6B','#E8A838','#D64545'];
const FN={f0m:'متوسط التردد الأساسي (هرتز)',f0sd:'تباين التردد',f0r:'مدى التردد',jit:'تذبذب التردد (تقريبي)',shim:'تذبذب الشدة (تقريبي)',hnr:'نسبة النغمة للضوضاء',vf:'نسبة الجزء المصوّت',dbm:'متوسط الشدة (ديسيبل)',dbs:'تباين الشدة',cen:'مركز الطيف',rol:'حد الطيف 85%',fl:'تسطح الطيف',zcr:'معدل عبور الصفر',syl:'معدل المقاطع (تقريبي)',np:'عدد الوقفات',mp:'متوسط الوقفة (ث)',xp:'أطول وقفة (ث)',spd:'سرعة الحركة',irr:'عدم الانتظام',jerk:'التقطع في الحركة',rng:'مدى الحركة',len:'طول المسار',intr:'انقطاعات اليد',trem:'نسبة الاهتزاز (3–8 هرتز)',valid:'إجابات صحيحة',rep:'مكررات',sw:'مرات التبديل'};

function consent(){A.innerHTML=hd('<span></span>')+`<main><h2>قبل أن تبدأ</h2><div class="card"><h3>إذن الكاميرا والميكروفون</h3><p>يحتاج أثر إلى الكاميرا لتتبع حركة يدك والميكروفون لتحليل صوتك أثناء اختبار قصير. يستخدم تفريغ الكلام خدمة المتصفح وقد تتم معالجته خارج الجهاز.</p></div><div class="card"><h3>شروط الاستخدام</h3><p>أثر لا يشخّص أي مرض ولا يوصي بعلاج، ولا يغني عن تقييم الطبيب. لا تؤخر طلب الرعاية الطبية عند ظهور أعراض مقلقة.</p></div><label><input type="checkbox" id="cb"> أوافق على الشروط وعلى استخدام الكاميرا والميكروفون</label><button class="btn" data-a="ok">متابعة</button></main>`}

function home(){const n=db.S.length,t=T[n%6],l=db.S[n-1],displayName=localStorage.getItem('athar-name')||'';A.innerHTML=hd()+`<main><h2>${displayName?`مرحبًا ${escapeHtml(displayName)}`:'متابعة الجلسات'}</h2><div class="hero">الجلسة رقم <b>${n+1}</b><br><small>اختبار اليوم: ${t.n}</small></div>${emergency()}<div class="card"><h3>ماذا يقيس اختبار اليوم؟</h3><p>${t.m}</p><p class="m">${t.p} · المدة: ${duration(t)}</p></div><div class="card"><h3>نتيجتك بشكل عام</h3>${l?`${chip(l.lv)} <span class="m">${when(l.ts)}${l.demo?' · بيانات توضيحية':''}</span>${spark()}`:'<p class="m">لا توجد جلسات بعد. ابدأ جلستك الأولى أو حمّل سجلًا توضيحيًا.</p>'}</div><div class="card"><h3>ملخص آخر ثلاث جلسات</h3>${recentThree()}</div><div class="card"><h3>نتيجة كل اختبار</h3>${T.map(x=>{const q=db.S.filter(s=>s.tid==x.id),z=q[q.length-1];return`<div class="row"><span>${x.n}</span><span>${z?chip(z.lv)+' · '+q.length+' جلسة':'—'}</span></div>`}).join('')}</div><button class="btn" data-a="start">بدء جلسة جديدة</button><button class="btn o" data-a="nav" data-v="info">عن الاختبارات</button>${demoButton()}</main>`+bar()}

function seed(){if(hasDemo()){db.S=db.S.filter(x=>!x.demo);save();toast('تمت إزالة السجلات التوضيحية؛ عاد الموقع إلى سجلك الطبيعي.');V='home';draw();return}const B={v:{f0m:140,f0sd:18,f0r:60,jit:.012,shim:.06,hnr:14,vf:.55,dbm:-28,dbs:6,cen:900,rol:2600,fl:.1,zcr:.08,syl:3.5,np:6,mp:.5,xp:1.2},m:{spd:.5,irr:.8,jerk:3,rng:.3,len:6,intr:0,trem:.15},c:{valid:14,rep:1}},levels=[0,0,0,0,1,1,2,2,0,1,2,0,1,2,0,1,2,0],g=(i)=>1+(Math.sin(i*7.31+1)*.12);for(let i=0;i<18;i++){const t=T[i%6],o={};for(const k in B){o[k]={};for(const f in B[k]){let factor=g(i);if(levels[i]===1&&k==='v'&&['f0sd','jit','np','xp'].includes(f))factor=1.35;if(levels[i]===1&&k==='m'&&['irr','jerk','intr','trem'].includes(f))factor=1.5;if(levels[i]===1&&k==='c'&&f==='valid')factor=.72;if(levels[i]===2&&k==='v'&&['f0sd','jit','np','xp'].includes(f))factor=1.85;if(levels[i]===2&&k==='m'&&['irr','jerk','intr','trem'].includes(f))factor=2.1;if(levels[i]===2&&k==='c'&&f==='valid')factor=.45;o[k][f]=B[k][f]*factor}}if(t.k==='sw')o.c.sw=levels[i]===0?9:levels[i]===1?5:2;const s=evalS({ts:Date.now()-(18-i)*864e5,tid:t.id,q:85,v:o.v,m:o.m,c:o.c,demo:true,quality:'بيانات توضيحية'},db.S);s.lv=levels[i];s.sc={v:levels[i]===0?88:levels[i]===1?68:48,c:levels[i]===0?88:levels[i]===1?65:45,m:levels[i]===0?88:levels[i]===1?66:46};s.eventText=levels[i]===0?'محاكاة: لا يوجد تنبيه؛ متابعة روتينية.':levels[i]===1?'محاكاة: تم تسجيل تنبيه متابعة وإعداد رسالة للطبيب وجهة الاتصال الموثوقة — لم تُرسل فعليًا.':'محاكاة عاجلة: أولوية مرتفعة؛ تم إعداد رسالة تنبيه للطبيب وجهة الاتصال — لم تُرسل فعليًا. في حالة الطوارئ اتصل 997 داخل السعودية.';db.S.push(s)}save();toast('تم تحميل سجل توضيحي متنوع. استخدم زر إعادة التعيين لإزالته.');V='home';draw()}
