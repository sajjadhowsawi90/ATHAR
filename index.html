<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أثر — نموذج تفاعلي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F8F8;--c:#fff;--t:#0B2540;--m:#5B7083;--p:#0F8B8D;--ok:#2E9E6B;--w:#E8A838;--r:#D64545;--l:#D9E6E8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1A2A;--c:#13283D;--t:#EAF3F4;--m:#9FB6C8;--l:#23405A}}
:root[data-theme="dark"]{--bg:#0B1A2A;--c:#13283D;--t:#EAF3F4;--m:#9FB6C8;--l:#23405A}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.6 Cairo,Tahoma,sans-serif}
.wrap{max-width:980px;margin:auto;padding:16px}
.top{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:center}
.top b{font-size:28px;color:var(--p)}.en{direction:ltr;display:inline-block;color:var(--m);font-weight:600}
.note{font-size:13px;color:var(--m);background:var(--c);padding:4px 12px;border-radius:20px}
button{font:inherit;cursor:pointer;color:var(--t)}
.tabs,.sc{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0;align-items:center}
.tabs button,.sc button{background:var(--c);border:1px solid var(--l);border-radius:20px;padding:6px 16px}
.on{background:var(--p)!important;color:#fff!important;border-color:var(--p)!important}
.phone{width:320px;max-width:100%;min-height:560px;margin:auto;border:8px solid var(--t);border-radius:36px;background:var(--c);padding:18px;display:flex;flex-direction:column;gap:12px}
.phone h3{margin:0}.card{background:var(--bg);border-radius:14px;padding:12px}.card small,.m{color:var(--m)}
.btn{background:var(--p);color:#fff;border:0;border-radius:14px;padding:12px;font-weight:700;width:100%}
.btn.o{background:none;color:var(--p);border:1px solid var(--p)}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chips span,.tag{background:var(--bg);border-radius:20px;padding:2px 12px;font-size:14px}
.tag{color:#fff;font-size:13px}
.big{font-size:44px;text-align:center;font-weight:800}
.wave{display:flex;gap:4px;height:60px;align-items:center;justify-content:center}
.wave i{width:6px;background:var(--p);border-radius:3px;animation:w 1s infinite ease-in-out}
@keyframes w{50%{height:50px}0%,100%{height:10px}}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--l)}
.nav{margin-top:auto;display:flex;gap:8px}.nav button{flex:1;background:none;border:0;padding:8px;color:var(--m)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:12px}
.p{background:var(--c);border-radius:16px;padding:16px;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:420px}td,th{padding:6px;text-align:right;border-bottom:1px solid var(--l)}
</style></head><body><div class="wrap">
<div class="top"><div><b>أثر</b> <span class="en">ATHAR</span></div><span class="note">نموذج تفاعلي توضيحي · بيانات تجريبية وليست قياسات حقيقية</span></div>
<div class="tabs"><button id="tp" class="on">تطبيق المريض</button><button id="td">لوحة الطبيب</button></div>
<div id="vp"><div class="sc"><span>سيناريو الجلسة القادمة:</span><button data-s="ok" class="on">مستقر</button><button data-s="f">يحتاج متابعة</button><button data-s="p">تغير ذو أولوية</button></div><div class="phone" id="ph"></div></div>
<div id="vd" hidden></div></div>
<script>
let sc='ok',D={v:[70,74,78,82,86,89],c:[72,76,79,82,85,86],m:[88,86,85,84,83,83],l:['ok','ok','ok','ok','ok','ok']},iv;
const LN={ok:'مستقر',f:'يحتاج متابعة',p:'تغير ذو أولوية'},CL={ok:'var(--ok)',f:'var(--w)',p:'var(--r)'},DL={ok:[1,0,0],f:[-4,-5,-6],p:[-12,-10,-16]};
const $=s=>document.querySelector(s),P=h=>{$('#ph').innerHTML=h};
const tag=l=>`<span class="tag" style="background:${CL[l]}">${LN[l]}</span>`;
const nav=()=>`<div class="nav"><button onclick="home()">الرئيسية</button><button onclick="log()">السجل</button></div>`;
function home(){clearInterval(iv);P(`<h3>مرحبًا أ. أحمد</h3><div class="card"><small>الجلسة القادمة</small><br>خلال يومين</div><div class="card"><small>الحالة الأساسية</small><br>مسجّلة ✓</div><div class="chips"><span>🎙 الصوت</span><span>🧠 الإدراك</span><span>✋ الحركة</span></div><button class="btn" onclick="rec()">بدء جلسة جديدة</button>`+nav())}
function rec(){let t=0;P(`<h3>تسجيل الجلسة</h3><div class="card">ضع يدك أمام الكاميرا بوضعية ثابتة، ثم اذكر أكبر عدد ممكن من أسماء الحيوانات</div><div class="big" id="tm">00:00</div><div class="wave">${'<i></i>'.repeat(12).replace(/<i>/g,()=>`<i style="animation-delay:${Math.random()}s">`)}</div><button class="btn" onclick="an()">إيقاف</button>`);iv=setInterval(()=>{t++;$('#tm').textContent='00:'+String(t).padStart(2,'0')},1000)}
function an(){clearInterval(iv);const n=['الصوت','الحركة','الإدراك'];P(`<h3>تحليل متزامن</h3>`+n.map((x,i)=>`<div class="row"><span>${x}</span><span id="a${i}">⏳</span></div>`).join('')+`<p class="m">مراجعة جودة القياس قبل المقارنة بخط الأساس…</p>`);n.forEach((_,i)=>setTimeout(()=>{$('#a'+i).textContent='✓'},600*(i+1)));setTimeout(res,2600)}
function res(){const d=DL[sc],r=()=>Math.round(Math.random()*2-1),L=D.v.length-1;D.v.push(D.v[L]+d[0]+r());D.c.push(D.c[L]+d[1]+r());D.m.push(D.m[L]+d[2]+r());D.l.push(sc);
const txt={ok:'قياساتك مستقرة، وتُسجَّل الجلسة وتستمر المتابعة الدورية.',f:'تغير طفيف يحتاج متابعة. أُرسل إشعار إلى طبيبك وجهة الاتصال التي حددتها بموافقتك.',p:'رُصد تغير شاذ في الصوت والحركة بعد التأكد من جودة القياس، فأُرسل تنبيه فوري إلى طبيبك وجهة الاتصال، حتى لو لم يستمر التغير.'};
P(`<h3>نتيجة الجلسة</h3><div class="card" style="border-right:6px solid ${CL[sc]}">${tag(sc)}<p>${txt[sc]}</p></div><div class="row"><span>جودة القياس</span><b>${88+Math.round(Math.random()*5)}%</b></div>`+(sc=='p'?`<button class="btn">حجز موعد مع الطبيب</button><button class="btn o">الاتصال بالعيادة</button>`:'')+`<p class="m">أثر لا يشخّص ولا يغني عن تقييم الطبيب.</p><button class="btn o" onclick="home()">رجوع</button>`)}
function log(){P(`<h3>سجل الجلسات</h3>`+D.l.map((l,i)=>`<div class="row"><span>جلسة ${i+1}</span>${tag(l)}</div>`).reverse().slice(0,7).join('')+nav())}
function ch(a,c){const n=a.length;return`<polyline fill="none" stroke="${c}" stroke-width="2.5" points="${a.map((v,i)=>(10+i*280/(n-1)).toFixed(1)+','+(110-(Math.max(40,Math.min(100,v))-40)*100/60).toFixed(1)).join(' ')}"/>`}
function dash(){const L=D.l.at(-1),z=a=>a.at(-1);$('#vd').innerHTML=`<div class="g"><div class="p"><small class="m">مستوى التنبيه الحالي</small><br>${tag(L)}</div><div class="p"><small class="m">آخر جلسة</small><br>جلسة ${D.l.length}</div><div class="p"><small class="m">الصوت · الإدراك · الحركة</small><br><b>${z(D.v)} · ${z(D.c)} · ${z(D.m)}</b></div></div><div class="p"><b>التغيرات عبر الجلسات</b><svg viewBox="0 0 300 120" width="100%">${ch(D.v,'#0F8B8D')}${ch(D.c,'#7A5AC8')}${ch(D.m,'#E8A838')}</svg><div class="chips"><span style="color:#0F8B8D">● الصوت</span><span style="color:#7A5AC8">● الإدراك</span><span style="color:#E8A838">● الحركة</span></div></div><div class="p" style="margin-top:12px"><b>آخر الجلسات</b><table><tr><th>الجلسة</th><th>الصوت</th><th>الإدراك</th><th>الحركة</th><th>المستوى</th></tr>${D.l.map((l,i)=>`<tr><td>${i+1}</td><td>${D.v[i]}</td><td>${D.c[i]}</td><td>${D.m[i]}</td><td>${tag(l)}</td></tr>`).reverse().slice(0,6).join('')}</table></div><p class="m">لوحة توضيحية ببيانات تجريبية.</p>`}
$('#tp').onclick=()=>{$('#vp').hidden=false;$('#vd').hidden=true;$('#tp').className='on';$('#td').className=''};
$('#td').onclick=()=>{dash();$('#vp').hidden=true;$('#vd').hidden=false;$('#td').className='on';$('#tp').className=''};
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{sc=b.dataset.s;document.querySelectorAll('[data-s]').forEach(x=>x.className=x==b?'on':'')});
home();
</script></body></html>
