<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>أثر — ATHAR</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b2540;--teal:#0f8b8d;--teal2:#0a6c78;--muted:#5b7083;--bg:#eef6f6;--line:#e1eded;--green:#2e9e6b;--amber:#e8a838;--red:#d64545}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 Cairo,Tahoma,sans-serif}#app{max-width:560px;min-height:100vh;margin:auto;background:linear-gradient(#fff,#f6fbfb);padding-bottom:76px;box-shadow:0 0 25px #0b254012}header{position:sticky;top:0;z-index:3;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line)}header strong{font-size:25px;color:var(--teal)}main{padding:14px 16px}h2{margin:4px 0 10px}h3{margin:0 0 6px;font-size:17px}.muted{color:var(--muted);font-size:14px}.card{background:white;border:1px solid #e6f0f1;border-radius:17px;padding:14px;margin:12px 0;box-shadow:0 3px 12px #0b254008}.hero{background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff;border:0;padding:18px;border-radius:19px;font-size:20px}.btn{display:block;width:100%;margin:8px 0;padding:12px;border:0;border-radius:14px;background:var(--teal);color:white;font:700 16px Cairo;cursor:pointer}.btn.alt{background:white;color:var(--teal);border:1px solid var(--teal)}.btn.red{background:#fff;color:var(--red);border:1px solid var(--red)}.btn:disabled{opacity:.5}.chip{display:inline-block;border-radius:18px;padding:1px 12px;background:var(--teal);color:white;font-size:13px}.row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid #eaf2f3;font-size:14px}.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;display:flex;background:white;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0)}.tabs button{flex:1;background:white;border:0;padding:13px;font:600 15px Cairo;color:var(--muted)}.tabs button.active{color:var(--teal);border-top:3px solid var(--teal)}.emergency{padding:12px;border:1px solid #f1c7c7;background:#fff7f7;border-radius:14px}.videoBox{position:relative;aspect-ratio:4/3;background:#101820;border-radius:16px;overflow:hidden}.videoBox video,.videoBox canvas{position:absolute;width:100%;height:100%;inset:0;object-fit:cover;transform:scaleX(-1)}.frame{position:absolute;inset:18% 22% 10%;border:2px dashed #e8a838;border-radius:18px;pointer-events:none}.meter{height:8px;background:#e4eded;border-radius:9px;overflow:hidden}.meter span{display:block;height:100%;width:0;background:var(--green);transition:width .2s}.notice{background:#fff8e9;border-right:4px solid var(--amber);padding:10px;border-radius:8px;font-size:14px}.plot{background:#f8fbfb;padding:8px;border-radius:12px}.plot svg{width:100%;height:auto}.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px}.word{display:inline-block;padding:3px 10px;margin:3px;border-radius:16px;background:#dff3ea;cursor:pointer}.word.off{background:#f8e0e0;text-decoration:line-through}.scroller{overflow:auto}table{width:100%;min-width:600px;border-collapse:collapse;font-size:13px}td,th{text-align:right;padding:7px;border-bottom:1px solid var(--line)}summary{cursor:pointer}textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px;font:inherit}.hide{display:none!important}@media print{header,.tabs,.btn{display:none!important}}
</style>
</head>
<body><div id="app"><main><h2>أثر</h2><p>جارٍ تحميل الصفحة…</p></main></div>
<script>
(()=>{'use strict';
const app=document.getElementById('app'),STORE='athar',levels=['مستقر','يحتاج متابعة','أولوية'],colors=['#2e9e6b','#e8a838','#d64545'];
const tests=[{id:'animals',name:'الطلاقة الدلالية: الحيوانات',kind:'semantic',seconds:60,help:'اذكر أكبر عدد ممكن من أسماء الحيوانات خلال دقيقة.'},{id:'letters1',name:'الطلاقة الحرفية: ط، ر، و',kind:'letters',letters:['ط','ر','و'],seconds:60,help:'دقيقة لكل حرف؛ إجمالي المهمة ثلاث دقائق.'},{id:'switch1',name:'التناوب بين الفئات',kind:'switch',seconds:60,help:'اذكر حيوانًا ثم فاكهة أو خضارًا بالتناوب لمدة دقيقة.'},{id:'produce',name:'الطلاقة الدلالية: الفواكه والخضروات',kind:'semantic',seconds:60,help:'اذكر أكبر عدد ممكن من الفواكه والخضروات خلال دقيقة.'},{id:'letters2',name:'الطلاقة الحرفية: ق، د، س',kind:'letters',letters:['ق','د','س'],seconds:60,help:'دقيقة لكل حرف؛ إجمالي المهمة ثلاث دقائق.'},{id:'switch2',name:'التناوب بين الفئات — نسخة بديلة',kind:'switch',seconds:60,help:'اذكر حيوانًا ثم فاكهة أو خضارًا بالتناوب لمدة دقيقة.'}];
const animalSet=new Set('قطة قط كلب حصان جمل ناقة بعير بقرة ثور خروف غنم ماعز حمار أسد نمر فهد فيل زرافة قرد ذئب ثعلب أرنب فأر دجاجة ديك بطة حمامة صقر نسر عصفور سمكة سمك حوت دلفين قرش تمساح ثعبان سلحفاة ضفدع خفاش غزال دب'.split(' '));
const produceSet=new Set('تفاح برتقال موز عنب رمان تمر بطيخ شمام فراولة مانجو جوافة خوخ مشمش كمثرى تين ليمون كيوي أناناس طماطم خيار بصل ثوم بطاطس جزر كوسا باذنجان فلفل خس جرجير ملفوف قرنبيط سبانخ بامية ذرة فجل زيتون توت'.split(' '));
let db;try{db=JSON.parse(localStorage.getItem(STORE)||'{"consent":false,"sessions":[]}')}catch{db={consent:false,sessions:[]}}if(!Array.isArray(db.sessions))db.sessions=[];
let screen='home',mediaStream=null,handModel=null,mediaActive=false,runActive=false,handSeen=0,audioLevel=0,lightLevel=0,landmarks=[],raf=0,recorder=null,transcript='',timerId=0;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(STORE,JSON.stringify(db));return true}catch{return false}}
function currentTest(){return tests[db.sessions.length%tests.length]}function hasDemo(){return db.sessions.some(x=>x.demo)}function tag(level){return `<span class="chip" style="background:${colors[level]}">${levels[level]}</span>`}function date(ts){return new Date(ts).toLocaleString('ar-SA',{dateStyle:'short',timeStyle:'short'})}function metric(n,v){return `<div class="row"><span>${n}</span><b>${v??'—'}</b></div>`}
function top(title=''){return `<header><strong>أثر <small style="font:13px Arial;color:#5b7083">ATHAR</small></strong>${title}</header>`}function nav(){return `<nav class="tabs"><button class="${screen==='home'?'active':''}" data-nav="home">الرئيسية</button><button class="${screen==='log'?'active':''}" data-nav="log">السجل</button><button data-nav="doctor">وضع الطبيب</button></nav>`}
function emergency(){return `<div class="emergency"><b>تحتاج مساعدة عاجلة؟</b><p class="muted">للحالات الطبية الطارئة في السعودية اتصل بالهلال الأحمر على 997. خارج السعودية اتصل برقم الطوارئ المحلي. لا تعتمد على التطبيق في الطوارئ.</p><a class="btn red" href="tel:997">اتصال بالطوارئ — 997</a></div>`}
function summary3(){const recent=db.sessions.slice(-3).reverse();if(!recent.length)return '<p class="muted">ستظهر ملخصات الصوت والحركة والإدراك بعد تسجيل الجلسات.</p>';return recent.map((s,i)=>`<details ${i===0?'open':''}><summary>الجلسة ${db.sessions.length-i} · ${esc(s.testName)} ${tag(s.level)} ${s.demo?'· توضيحية':''}</summary>${metric('الصوت — متوسط التردد',s.voice?.f0?`${s.voice.f0} هرتز`:'—')}${metric('الصوت — نسبة الصمت',s.voice?.pause??'—')}${metric('الحركة — سرعة المؤشر',s.motion?.speed??'—')}${metric('الحركة — نسبة ظهور اليد',s.motion?.coverage??'—')}${metric('الإدراك — إجابات مطابقة',s.cognitive?.valid??'—')}${metric('الإدراك — تكرارات',s.cognitive?.repeats??'—')}<p class="muted">${esc(s.notice||'لا يوجد إجراء مسجل.')}</p></details>`).join('')}
function chart(){const ss=db.sessions.slice(-12);if(ss.length<2)return '<p class="muted">يظهر الرسم بعد توفر جلستين.</p>';const specs=[['voice','#0f8b8d','الصوت'],['cognitive','#7455bf','الإدراك'],['motion','#e8a838','الحركة']];const yy=(s,k)=>95-(s.scores?.[k]??70)*.85;return `<div class="plot"><b>اتجاه المؤشرات عبر الجلسات</b><p class="muted">كل نقطة تمثل جلسة. المحور الرأسي درجة توضيحية فقط (ليست تشخيصًا).</p><svg viewBox="0 0 300 115" role="img" aria-label="تغير المؤشرات عبر الجلسات"><line x1="20" y1="10" x2="20" y2="98" stroke="#9aabad"/><line x1="20" y1="98" x2="290" y2="98" stroke="#9aabad"/><text x="1" y="14" font-size="9">١٠٠</text><text x="7" y="97" font-size="9">٠</text>${specs.map(([k,c])=>`<polyline fill="none" stroke="${c}" stroke-width="2.5" points="${ss.map((s,i)=>`${22+i*265/Math.max(1,ss.length-1)},${yy(s,k)}`).join(' ')}"/>${ss.map((s,i)=>`<circle cx="${22+i*265/Math.max(1,ss.length-1)}" cy="${yy(s,k)}" r="3" fill="${c}"><title>الجلسة ${i+1}: ${s.scores?.[k]??'—'}</title></circle>`).join('')}`).join('')}</svg><div class="legend">${specs.map(([k,c,l])=>`<span style="color:${c}">● ${l}</span>`).join('')}</div></div>`}
function demoControl(){return `<button class="btn alt" data-action="demo">${hasDemo()?'إعادة التعيين وإزالة السجل التوضيحي':'تحميل سجل توضيحي'}</button>`}
function renderHome(){screen='home';stopMedia();const t=currentTest(),name=localStorage.getItem('athar-name')||'';app.innerHTML=top()+`<main><h2>${name?'مرحبًا '+esc(name):'متابعة الجلسات'}</h2><div class="hero">الجلسة رقم <b>${db.sessions.length+1}</b><br><small>اختبار اليوم: ${esc(t.name)}</small></div>${emergency()}<section class="card"><h3>مهمة اليوم</h3><p>${esc(t.help)}</p><p class="muted">المدة: ${t.seconds} ثانية${t.kind==='letters'?' لكل حرف، ٣ دقائق إجمالًا':''}.</p></section><section class="card"><h3>المؤشر العام</h3>${db.sessions.length?`${tag(db.sessions.at(-1).level)} <span class="muted">${date(db.sessions.at(-1).ts)}</span>${chart()}`:'<p class="muted">لا توجد جلسات بعد. يمكنك بدء جلسة أو تحميل سجل توضيحي.</p>'}</section><section class="card"><h3>ملخص آخر ثلاث جلسات</h3>${summary3()}</section><section class="card"><h3>آخر نتيجة لكل اختبار</h3>${tests.map(t=>{const x=[...db.sessions].reverse().find(s=>s.testId===t.id);return `<div class="row"><span>${esc(t.name)}</span><span>${x?tag(x.level):'—'}</span></div>`}).join('')}</section><button class="btn" data-action="start">بدء جلسة</button>${demoControl()}</main>${nav()}`}
function renderLog(){screen='log';stopMedia();app.innerHTML=top()+`<main><h2>سجل الجلسات</h2>${db.sessions.length?[...db.sessions].reverse().map((s,i)=>`<section class="card"><details><summary>${date(s.ts)} · ${esc(s.testName)} ${tag(s.level)} ${s.demo?'· توضيحي':''}</summary><p><b>${esc(s.notice||'لا يوجد إجراء مسجل.')}</b></p><h3>الصوت</h3>${metric('التردد الأساسي',s.voice?.f0?`${s.voice.f0} هرتز`:'—')}${metric('الصمت',s.voice?.pause??'—')}<h3>الحركة</h3>${metric('سرعة الحركة',s.motion?.speed??'—')}${metric('ظهور اليد',s.motion?.coverage??'—')}<h3>الإدراك</h3>${metric('إجابات مطابقة',s.cognitive?.valid??'—')}${metric('تكرارات',s.cognitive?.repeats??'—')}</details></section>`).join(''):'<p class="muted">لا توجد جلسات.</p>'}<button class="btn alt" data-action="print">طباعة / حفظ PDF</button></main>${nav()}`}
function renderDoctor(){screen='doctor';stopMedia();const n=db.sessions.length,counts=[0,1,2].map(l=>db.sessions.filter(s=>s.level===l).length);app.innerHTML=top('<button class="btn alt" style="width:auto;margin:0;padding:6px 12px" data-nav="home">واجهة المريض</button>')+`<main><h2>لوحة الطبيب</h2><p class="notice">بيانات العرض التوضيحي لا تمثل مريضًا حقيقيًا. التنبيهات المعروضة داخل السجل التجريبي محاكاة فقط ولا تُرسل رسائل فعلية.</p><section class="card">${metric('إجمالي الجلسات',n)}${metric('مستقر / متابعة / أولوية',counts.join(' / '))}${metric('آخر جلسة',n?date(db.sessions.at(-1).ts):'—')}</section><section class="card">${chart()}</section><section class="card"><h3>آخر ثلاث جلسات: المسارات الثلاثة</h3>${summary3()}</section><section class="card scroller"><h3>السجل التفصيلي</h3>${n?`<table><thead><tr><th>التاريخ</th><th>الاختبار</th><th>الصوت</th><th>الحركة</th><th>الإدراك</th><th>الحالة والإجراء</th></tr></thead><tbody>${[...db.sessions].reverse().map(s=>`<tr><td>${date(s.ts)}</td><td>${esc(s.testName)}</td><td>${s.scores?.voice??'—'}</td><td>${s.scores?.motion??'—'}</td><td>${s.scores?.cognitive??'—'}</td><td>${tag(s.level)}<br>${esc(s.notice||'—')}</td></tr>`).join('')}</tbody></table>`:'<p class="muted">لا توجد جلسات.</p>'}</section>${demoControl()}<button class="btn alt" data-action="print">طباعة / حفظ PDF</button></main>${nav()}`}
function renderConsent(){screen='consent';app.innerHTML=top()+`<main><h2>قبل أن تبدأ</h2><section class="card"><h3>إذن الكاميرا والميكروفون</h3><p>يحتاج أثر إلى الكاميرا لتتبع حركة اليد والميكروفون لتحليل خصائص الصوت في جلسة قصيرة.</p></section><section class="card"><h3>شروط الاستخدام</h3><p>أثر لا يشخّص مرضًا ولا يوصي بعلاج. لا تؤخر الرعاية الطبية بسبب التطبيق.</p></section><label><input id="consentCheck" type="checkbox"> أوافق على الشروط واستخدام الكاميرا والميكروفون.</label><button class="btn" data-action="consent">متابعة</button></main>`}
function renderSession(){screen='session';const t=currentTest();app.innerHTML=top('<button class="btn alt" style="width:auto;margin:0;padding:6px 12px" data-nav="home">إلغاء</button>')+`<main><h2>${esc(t.name)}</h2><section class="card"><p>${esc(t.help)}</p><p class="muted">ضع يدك كاملة داخل الإطار، واستخدم الهاتف بإضاءة جيدة. مدة المهمة: ${t.seconds}${t.kind==='letters'?' ثانية لكل حرف':''}.</p></section><div class="videoBox"><video id="video" playsinline muted></video><canvas id="points"></canvas><div class="frame"></div></div><section class="card">${[['hand','ظهور اليد'],['light','الإضاءة'],['audio','الصوت']].map(([id,label])=>`<div class="row"><span>${label}</span><b id="${id}Text">بانتظار التشغيل</b></div><div class="meter"><span id="${id}Bar"></span></div>`).join('')}<div class="row"><b>جودة عامة</b><b id="qualityText">—</b></div></section><p id="status" class="muted">شغّل الكاميرا والميكروفون لبدء الفحص.</p><button class="btn alt" data-action="media">تشغيل الكاميرا والميكروفون</button><div class="big" id="timer"></div><p id="liveText" class="muted"></p><button class="btn" id="beginBtn" data-action="begin" disabled>ابدأ الاختبار</button><div id="review" class="card hide"></div></main>`}
async function startMedia(){if(mediaStream){return}const status=document.getElementById('status');try{if(!navigator.mediaDevices?.getUserMedia)throw Error('المتصفح لا يدعم الكاميرا أو يلزم فتح الموقع عبر HTTPS');status.textContent='جارٍ طلب إذن الكاميرا والميكروفون…';mediaStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:true});const v=document.getElementById('video');v.srcObject=mediaStream;await v.play();status.textContent='جارٍ تحميل متتبع اليد…';const {HandLandmarker,FilesetResolver}=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0');const fs=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm');const opts={baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task'},runningMode:'VIDEO',numHands:1};handModel=await HandLandmarker.createFromOptions(fs,opts);mediaActive=true;status.textContent='جاهز: حرّك يدك داخل الإطار للتحقق من التتبع.';document.querySelector('[data-action="media"]').textContent='الكاميرا تعمل';renderLoop()}catch(e){status.textContent='تعذر تشغيل الكاميرا أو تتبع اليد: '+e.message+' — تحقق من الإذن والاتصال ثم أعد المحاولة.';stopMedia()}}
function renderLoop(){if(!mediaActive||screen!=='session')return;raf=requestAnimationFrame(renderLoop);const v=document.getElementById('video'),c=document.getElementById('points');if(!v||v.readyState<2)return;const w=v.videoWidth,h=v.videoHeight;if(!w||!h)return;if(c.width!==w||c.height!==h){c.width=w;c.height=h}const x=c.getContext('2d');x.clearRect(0,0,w,h);try{const result=handModel.detectForVideo(v,performance.now()),hand=result.landmarks?.[0];if(hand){handSeen++;x.fillStyle='#e8a838';hand.forEach(p=>{x.beginPath();x.arc(p.x*w,p.y*h,Math.max(4,w/150),0,Math.PI*2);x.fill()})}}catch(e){console.error(e)}const a=document.getElementById('handText'),ab=document.getElementById('handBar');if(a)a.textContent=handSeen?'تظهر اليد':'أدخل يدك في الإطار';if(ab)ab.style.width=handSeen?'85%':'10%';const lum=document.createElement('canvas');lum.width=16;lum.height=12;try{const q=lum.getContext('2d');q.drawImage(v,0,0,16,12);const data=q.getImageData(0,0,16,12).data;let avg=0;for(let i=0;i<data.length;i+=4)avg+=(data[i]+data[i+1]+data[i+2])/3;lightLevel=avg/(data.length/4);const pct=Math.max(0,Math.min(100,(lightLevel-25)*1.4));document.getElementById('lightText').textContent=pct>45?'الإضاءة مناسبة':'حسّن الإضاءة';document.getElementById('lightBar').style.width=pct+'%'}catch{}const qtext=document.getElementById('qualityText');if(qtext)qtext.textContent=(handSeen?'اليد ظاهرة':'اليد غير ظاهرة')+' · '+(lightLevel>55?'إضاءة جيدة':'إضاءة منخفضة');const btn=document.getElementById('beginBtn');if(btn)btn.disabled=!handSeen||lightLevel<20}
function stopMedia(){mediaActive=false;runActive=false;cancelAnimationFrame(raf);clearInterval(timerId);if(mediaStream)mediaStream.getTracks().forEach(t=>t.stop());mediaStream=null;try{handModel?.close()}catch{}handModel=null}
function normalize(w){return w.toLowerCase().replace(/[\u064B-\u065F\u0640]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[.,،؛!?؟]/g,'').replace(/^ال/,'')}
function startTask(){const t=currentTest();runActive=true;transcript='';const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){try{recorder=new SR();recorder.lang='ar-SA';recorder.continuous=true;recorder.interimResults=false;recorder.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)transcript+=' '+e.results[i][0].transcript;const live=document.getElementById('liveText');if(live)live.textContent=transcript};recorder.onerror=()=>{};recorder.start()}catch{recorder=null}}else document.getElementById('liveText').textContent='التفريغ غير متاح؛ ستتمكن من إدخال الكلمات يدويًا.';const seconds=t.seconds*(t.kind==='letters'?3:1),start=Date.now();document.getElementById('beginBtn').disabled=true;function tick(){if(!runActive)return;const left=Math.max(0,seconds-Math.floor((Date.now()-start)/1000));document.getElementById('timer').textContent=`${left} ث`;if(left<=0){runActive=false;try{recorder?.stop()}catch{}showReview(t);return}timerId=setTimeout(tick,250)}tick()}
function scoreWords(t,text){const words=text.trim().split(/\s+/).filter(Boolean),accepted=[],seen=new Set();for(const raw of words){const w=normalize(raw);if(w.length<2)continue;let ok=false;if(t.kind==='semantic')ok=[...t.S||[]].some(x=>normalize(x)===w)||(t.id==='animals'?animalSet:produceSet).has(w);else if(t.kind==='letters')ok=t.letters.some(letter=>w.startsWith(normalize(letter)));else ok=animalSet.has(w)||produceSet.has(w);if(ok&&!seen.has(w)){accepted.push(w);seen.add(w)}}return{words,valid:accepted.length,repeats:words.length-accepted.length}}
function showReview(t){const panel=document.getElementById('review');panel.classList.remove('hide');panel.innerHTML=`<h3>راجع الكلمات قبل حفظ الجلسة</h3><p class="muted">يمكنك تعديل التفريغ أو إدخال الكلمات يدويًا.</p><textarea id="transcript" rows="4">${esc(transcript.trim())}</textarea><p class="muted">التصنيف آلي ومبسط؛ راجع الإجابات.</p><button class="btn" data-action="saveSession">حفظ الملخص</button>`;panel.scrollIntoView({behavior:'smooth'})}
function saveSession(){const t=currentTest(),text=document.getElementById('transcript')?.value||'',score=scoreWords(t,text),quality=handSeen>20&&lightLevel>20?'مقبولة مبدئيًا':'منخفضة';const level=quality==='مقبولة مبدئيًا'&&score.valid<3?1:0;const entry={ts:Date.now(),testId:t.id,testName:t.name,level,quality,demo:false,voice:{f0:null,pause:'غير متاح في هذا النموذج'},motion:{speed:'غير متاح',coverage:handSeen?'تم تتبع اليد':'غير كافٍ'},cognitive:{valid:score.valid,repeats:score.repeats},scores:{voice:70,motion:handSeen?75:45,cognitive:Math.min(100,50+score.valid*4)},notice:'تم حفظ الملخص محليًا؛ لا تُرسل إشعارات فعلية.'};db.sessions.push(entry);save();stopMedia();renderHome()}
function createDemo(){if(hasDemo()){db.sessions=db.sessions.filter(s=>!s.demo);save();renderHome();return}const vals=[0,0,1,0,2,1,0,2,1,0,2,0,1,2,0,1,2,0];for(let i=0;i<vals.length;i++){const level=vals[i],t=tests[i%tests.length],scores=level===0?{voice:88-(i%3)*2,motion:86-(i%4)*2,cognitive:90-(i%3)*3}:level===1?{voice:66+(i%3)*2,motion:63+(i%4)*2,cognitive:68-(i%3)*2}:{voice:42+(i%3)*3,motion:46+(i%4)*2,cognitive:40+(i%3)*3};db.sessions.push({ts:Date.now()-(vals.length-i)*86400000,testId:t.id,testName:t.name,level,quality:'بيانات توضيحية',demo:true,scores,voice:{f0:level===0?'138':'متغير',pause:level===0?'منخفضة':'مرتفعة'},motion:{speed:level===0?'مستقرة':'متغيرة',coverage:level===0?'96%':'متقطعة'},cognitive:{valid:level===0?14:level===1?8:3,repeats:level===0?1:level},notice:level===0?'محاكاة: لا يوجد تنبيه؛ متابعة روتينية.':level===1?'محاكاة: تم إعداد تنبيه متابعة ورسالة للطبيب وجهة الاتصال؛ لم تُرسل فعليًا.':'محاكاة عاجلة: أولوية مرتفعة، وإشعار ورسالة للطبيب وجهة الاتصال معدّان فقط ولم يُرسلا.'})}save();renderHome()}
function route(target){if(target==='home')renderHome();else if(target==='log')renderLog();else if(target==='doctor')renderDoctor();else if(target==='start'){if(!db.consent)renderConsent();else renderSession()}else if(target==='info'){app.innerHTML=top()+`<main><h2>عن الاختبارات</h2>${tests.map(t=>`<section class="card"><h3>${esc(t.name)}</h3><p>${esc(t.help)}</p></section>`).join('')}<button class="btn alt" data-nav="home">رجوع</button></main>${nav()}`;screen='info'}}
app.addEventListener('click',e=>{const n=e.target.closest('[data-nav]');if(n){route(n.dataset.nav);return}const a=e.target.closest('[data-action]');if(!a)return;switch(a.dataset.action){case'consent':if(!document.getElementById('consentCheck')?.checked){alert('يرجى الموافقة للمتابعة.');return}db.consent=true;save();renderHome();break;case'start':route('start');break;case'media':startMedia();break;case'begin':startTask();break;case'saveSession':saveSession();break;case'demo':createDemo();break;case'print':window.print();break}});
window.addEventListener('error',e=>{console.error(e.error||e.message);if(app&&!app.innerHTML.trim())app.innerHTML='<main><h2>تعذر عرض الصفحة</h2><p>حدّث الصفحة أو امسح بيانات الموقع المحلية وحاول مجددًا.</p></main>'});
if(!db.consent)renderConsent();else renderHome();
})();
</script></body></html>
